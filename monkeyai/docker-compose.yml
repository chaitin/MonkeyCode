services:
  db:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/basic/postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monkeyai}
      POSTGRES_USER: ${POSTGRES_USER:-monkeyai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: ${MIGRATE_IMAGE:-monkeyai-migrate:local}
    build:
      context: ./backend/migrations
    command:
      - -path=/migrations
      - -database=${MONKEYAI_DATABASE_URL:-postgres://${POSTGRES_USER:-monkeyai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-monkeyai}?sslmode=disable}
      - up
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  rustfs:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/basic/rustfs:v1.0.0-rc.5
    user: "10001:10001"
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?请设置 RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?请设置 RUSTFS_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_OBS_LOG_DIRECTORY: /logs
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - ./data/rustfs:/data
      - ./data/rustfs-logs:/logs
    ports:
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  backend:
    image: ${BACKEND_IMAGE:-monkeyai-backend:local}
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    environment:
      MONKEYAI_S3_ENDPOINT: ${MONKEYAI_S3_ENDPOINT:-http://rustfs:9000}
      MONKEYAI_S3_REGION: ${MONKEYAI_S3_REGION:-us-east-1}
      MONKEYAI_S3_BUCKET: ${MONKEYAI_S3_BUCKET:-monkeyai-resources}
      MONKEYAI_S3_ACCESS_KEY: ${MONKEYAI_S3_ACCESS_KEY:-${RUSTFS_ACCESS_KEY}}
      MONKEYAI_S3_SECRET_KEY: ${MONKEYAI_S3_SECRET_KEY:-${RUSTFS_SECRET_KEY}}
      MONKEYAI_S3_FORCE_PATH_STYLE: ${MONKEYAI_S3_FORCE_PATH_STYLE:-true}
      MONKEYAI_MCP_ALLOWED_CIDRS: ${MONKEYAI_MCP_ALLOWED_CIDRS:-}

      MONKEYAI_DATABASE_URL: ${MONKEYAI_DATABASE_URL:-postgres://${POSTGRES_USER:-monkeyai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-monkeyai}?sslmode=disable}
      MONKEYAI_HTTP_ADDR: :8080
      MONKEYAI_LOG_LEVEL: ${MONKEYAI_LOG_LEVEL:-info}
      MONKEYAI_PUBLIC_URL: ${MONKEYAI_PUBLIC_URL:-http://localhost:8080}
      MONKEYAI_ADMIN_URL: ${MONKEYAI_ADMIN_URL:-http://localhost:8080}
      MONKEYAI_INITIAL_ADMIN_NAME: ${MONKEYAI_INITIAL_ADMIN_NAME:-MonkeyAI Admin}
      MONKEYAI_INITIAL_ADMIN_EMAIL: ${MONKEYAI_INITIAL_ADMIN_EMAIL:-}
      MONKEYAI_INITIAL_ADMIN_PASSWORD: ${MONKEYAI_INITIAL_ADMIN_PASSWORD:-}
    depends_on:
      rustfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp

  admin:
    image: ${ADMIN_IMAGE:-monkeyai-admin:local}
    build:
      context: ./admin
    restart: unless-stopped
    init: true
    ports:
      - "${MONKEYAI_ADMIN_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
