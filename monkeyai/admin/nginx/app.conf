root /usr/share/nginx/html;
index index.html;

location /preview/ {
    proxy_pass http://monkeyai_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_read_timeout 30m;
    proxy_buffering off;
    access_log off;
    error_log /dev/null;
}

location = /device {
    add_header Referrer-Policy "no-referrer" always;
    access_log off;
    error_log /dev/null;
    try_files $uri /index.html;
}

location = /api/auth/v1/client-requests/device {
    proxy_pass http://monkeyai_backend;
    proxy_set_header Host $http_host;
    proxy_buffering off;
    access_log off;
    error_log /dev/null;
}

location = /api/v1/endpoint-bridge {
    proxy_pass http://monkeyai_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
    client_max_body_size 64k;
}

location ~ ^/api/v1/endpoints/[0-9a-f-]+/proxy/ {
    proxy_pass http://monkeyai_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_read_timeout 30m;
    proxy_send_timeout 30m;
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 64m;
    access_log off;
    error_log /dev/null;
}

location ~ ^/endpoints/[0-9a-f-]+/files/ {
    proxy_pass http://monkeyai_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_read_timeout 30m;
    proxy_buffering off;
    access_log off;
    error_log /dev/null;
}

location = /api/v1/endpoints/connect {
    proxy_pass http://monkeyai_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
}

location ~ ^/api/admin/v1/resource-imports(?:/preview)?$ {
    client_max_body_size 2064m;
    proxy_pass http://monkeyai_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 30m;
    proxy_send_timeout 30m;
    proxy_buffering off;
}

location ~ ^/(?:api|oauth|v1|mcp)(?:/|$) {
    proxy_pass http://monkeyai_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
}

location = /.well-known/oauth-authorization-server {
    proxy_pass http://monkeyai_backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}
