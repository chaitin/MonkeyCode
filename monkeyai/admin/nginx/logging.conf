map $request_uri $access_path {
    ~^(?<access_path_without_args>[^?]*) $access_path_without_args;
    default $uri;
}

map $upstream_http_x_request_id $access_request_id {
    "" $request_id;
    default $upstream_http_x_request_id;
}

map "$access_path:$status" $access_log_enabled {
    default 1;
    # SPA 内部跳转后仍按原始路径保留设备授权页的日志禁用策略。
    ~^/device:[0-9][0-9][0-9]$ 0;
    ~^/(?:api|oauth|v1|mcp)(?:/|:) 1;
    ~*\.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?):[23][0-9][0-9]$ 0;
}

log_format monkeyai_access escape=json
    '{"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$request_uri",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_addr":"$upstream_addr",'
    '"request_id":"$access_request_id",'
    '"user_agent":"$http_user_agent",'
    '"request_length":$request_length,'
    '"response_bytes":$body_bytes_sent}';

access_log /dev/stdout monkeyai_access if=$access_log_enabled;
