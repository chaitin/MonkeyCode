load_module /usr/lib/nginx/modules/ngx_http_acme_module.so;

pid /tmp/nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    include /etc/nginx/monkeyai/logging.conf;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    client_max_body_size 100m;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    include /tmp/nginx/real-ip.conf;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    map $uri $monkeyai_target {
        default monkeyai_backend;
        ~^/(?:v1|v2|mcp|preview|endpoints|oauth)(?:/|$) monkeyai_proxy;
        ~^/api/(?:v1|host|kb)(?:/|$) monkeyai_proxy;
        ~^/api/auth/v1/(?:device|client-requests)(?:/|$) monkeyai_proxy;
        /api/auth/v1/profile/password monkeyai_proxy;
        ~^/api/admin/v1/(?:environments|environment-hosts|environment-images|engine-hosts|engine-host-enrollments|engine-upgrade|system-images)(?:/|$) monkeyai_proxy;
        /.well-known/oauth-authorization-server monkeyai_proxy;
    }

    upstream monkeyai_proxy {
        zone proxy 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        server monkeyai-proxy:8080 resolve;
        keepalive 32;
    }

    upstream monkeyai_admin {
        zone admin 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        server admin:8080 resolve;
        keepalive 8;
    }

    upstream monkeyai_backend {
        zone backend 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        server backend:8080 resolve;
        keepalive 32;
    }

    include /tmp/nginx/preview-site.conf;
    include /tmp/nginx/site.conf;
}
