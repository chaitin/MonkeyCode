load_module /usr/lib/nginx/modules/ngx_http_acme_module.so;

pid /tmp/nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Nginx request errors may contain raw paths or query strings even before
    # location selection. Backend diagnostics use controlled structured events.
    error_log /dev/null;
    map $request_method $monkeyai_log_method {
        default OTHER;
        GET GET; HEAD HEAD; POST POST; PUT PUT; PATCH PATCH;
        DELETE DELETE; OPTIONS OPTIONS; CONNECT CONNECT;
    }
    map $uri $monkeyai_log_route {
        default unmatched;
        /healthz /healthz;
        /readyz /readyz;
        ~^/api/admin/v1/resource-import-uploads(?:/|$) resource_upload;
        ~^/api/admin/v1/resource-imports(?:/|$) resource_import;
        ~^/api/admin/v1(?:/|$) admin_api;
        ~^/api/auth/v1(?:/|$) authentication;
        ~^/api/v1(?:/|$) agent_api;
        ~^/oauth(?:/|$) oauth;
        ~^/v1(?:/|$) model_gateway;
        ~^/mcp(?:/|$) mcp_gateway;
    }
    map $uri $monkeyai_log_access {
        default 1;
        ~^/preview/ 0;
        /device 0;
        /api/auth/v1/client-requests/device 0;
        /api/v1/endpoint-bridge 0;
        /api/v1/endpoints/connect 0;
        ~^/api/v1/endpoints/[0-9a-f-]+/proxy/ 0;
        ~^/endpoints/[0-9a-f-]+/files/ 0;
    }
    map $upstream_http_x_request_id $monkeyai_log_request_id {
        default "";
        "~^[0-9a-f]{32}$" $upstream_http_x_request_id;
    }
    log_format monkeyai_safe escape=json '{"method":"$monkeyai_log_method","route":"$monkeyai_log_route","status":$status,"duration_seconds":$request_time,"request_id":"$monkeyai_log_request_id"}';
    access_log /dev/stdout monkeyai_safe if=$monkeyai_log_access;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    client_max_body_size 100m;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    include /tmp/nginx/real-ip.conf;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    upstream monkeyai_backend {
        server backend:8080;
        keepalive 32;
    }

    include /tmp/nginx/preview-site.conf;
    include /tmp/nginx/site.conf;
}
