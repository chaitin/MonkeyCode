  /api/admin/v1/groups:
    get:
      summary: 查询成员分组
      description: 返回全部未删除分组及直接成员。团队根节点不入库，名称由 branding.workspace_name 设置提供；parent_id 为 null 的分组均为团队根节点的直属子分组，不预置任何分组。
      responses:
        "200":
          description: 分组列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberGroupsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ResourceError500"
    post:
      summary: 创建子分组
      description: 名称去除首尾空白后须为 1—100 个字符，同级名称不区分大小写且不能重复。parent_id 为 null 或省略时，创建团队根节点的直属子分组。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberGroupInput"
      responses:
        "201":
          description: 已创建分组
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberGroup"
        "400":
          $ref: "#/components/responses/ResourceError400"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceError404"
        "409":
          $ref: "#/components/responses/ResourceError409"
        "500":
          $ref: "#/components/responses/ResourceError500"
  /api/admin/v1/groups/{groupID}:
    parameters:
      - in: path
        name: groupID
        required: true
        description: 分组 UUID。
        schema:
          type: string
          format: uuid
    patch:
      summary: 修改分组名称或上级分组
      description: 至少指定 name 或 parent_id。parent_id 为 null 表示移动到团队根节点下，省略则保留原上级。不能移动到自身或后代中；更换上级会改变成员继承的资源授权。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberGroupInput"
      responses:
        "200":
          description: 已更新分组
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberGroup"
        "400":
          $ref: "#/components/responses/ResourceError400"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceError404"
        "409":
          $ref: "#/components/responses/ResourceError409"
        "500":
          $ref: "#/components/responses/ResourceError500"
    delete:
      summary: 删除分组
      description: 有子分组或成员计费归属引用时返回 409。软删除分组、移除直接成员关系并清除本组资源授权，保留成员账号。
      responses:
        "204":
          description: 已删除，无响应体。
        "400":
          $ref: "#/components/responses/ResourceError400"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceError404"
        "409":
          $ref: "#/components/responses/ResourceError409"
        "500":
          $ref: "#/components/responses/ResourceError500"
