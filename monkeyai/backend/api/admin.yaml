openapi: 3.1.0
info:
  title: MonkeyAI Admin API
  version: 1.0.0
security:
  - AdminSession: []
paths:
  /api/admin/v1/models:
    get:
      summary: 查询模型
      parameters:
        - in: query
          name: ownership_type
          description: 按模型所有权类型筛选；不传时返回全部模型。
          schema:
            type: string
            enum: [system, user]
      responses:
        "200":
          description: 模型列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: 创建系统模型
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModelInput"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/admin/v1/models/authorization-subjects:
    get:
      summary: 查询可授权的用户和分组
      responses:
        "200":
          description: 授权对象
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationSubjects"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/v1/models/{modelID}:
    parameters:
      - $ref: "#/components/parameters/ModelID"
    put:
      summary: 更新系统模型
      description: api_key 为空时保留原有上游密钥。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelInput"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: 删除系统模型
      responses:
        "204":
          description: 删除成功，无响应体。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/v1/models/{modelID}/enabled:
    parameters:
      - $ref: "#/components/parameters/ModelID"
    patch:
      summary: 启用或停用系统模型
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetModelEnabledInput"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/v1/api-keys:
    get:
      summary: 查询调用密钥
      parameters:
        - in: query
          name: user_id
          description: 按密钥所属用户筛选；不传时返回全部调用密钥。
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 调用密钥元数据列表，不包含密钥原文。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeysResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/v1/api-keys/{keyID}:
    parameters:
      - $ref: "#/components/parameters/KeyID"
    delete:
      summary: 管理员撤销调用密钥
      responses:
        "204":
          description: 撤销成功，无响应体。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/v1/rules:
