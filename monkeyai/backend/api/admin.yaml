openapi: 3.1.0
info:
  title: MonkeyAI Admin API
  version: 1.0.0
security:
  - AdminSession: []
paths:
  /api/admin/v1/identifiers:
    post:
      summary: 分配服务端标识
      description: 用于提交前需要持有标识的操作。幂等请求重试时须复用已分配的标识，新的操作应重新申请。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count]
              properties:
                count:
                  type: integer
                  minimum: 1
                  maximum: 1000
      responses:
        '200':
          description: 服务端生成的 UUID v4 列表；响应不可缓存。
          content:
            application/json:
              schema:
                type: object
                required: [ids]
                properties:
                  ids:
                    type: array
                    minItems: 1
                    maxItems: 1000
                    uniqueItems: true
                    items:
                      type: string
                      format: uuid
        '400':
          description: 标识数量或请求格式无效
        '401':
          description: 未登录
        '403':
          description: 需要管理员权限
  /api/auth/v1/methods:
    get:
      summary: 读取公开登录方式开关
      security: []
      responses:
        "200":
          description: 仅包含登录开关，不包含 SMTP 或 OAuth 密钥
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailLoginMethods"
        "503":
          description: 认证配置不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
  /api/auth/v1/email/code:
    post:
      summary: 发送邮箱验证码
      description: login 受 email_code_enabled 控制；register 需要开放注册并至少启用一种邮箱登录方式；reset 受
        password_enabled 控制。每邮箱每分钟最多 1 次、每小时最多 10 次，每连接来源 IP 每小时最多 30
        次；失败发送也计入限额。不存在或不符合用途的账号返回相同成功响应但不发送邮件。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - purpose
              properties:
                email: &a1
                  type: string
                  format: email
                  maxLength: 254
                  description: 邮箱会去除首尾空白并转为小写。
                purpose:
                  type: string
                  enum:
                    - login
                    - register
                    - reset
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - retry_after
                properties:
                  message:
                    type: string
                  retry_after:
                    type: integer
                    const: 60
        "400":
          description: 请求无效，或验证码无效、过期、超过错误次数限制
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "401":
          description: 邮箱密码不匹配或账号不符合登录入口角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "403":
          description: 对应登录方式或注册开关关闭
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "409":
          description: 邮箱已存在，注册冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "429":
          description: 验证码发送过于频繁
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
          headers:
            Retry-After:
              schema:
                type: integer
                const: 60
        "500":
          description: 认证操作失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "502":
          description: 邮件发送失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "503":
          description: 认证配置或邮件服务不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
  /api/auth/v1/email/reset-password:
    post:
      summary: 通过邮箱验证码重置密码
      description: 使用 reset 用途验证码，需要开启密码登录。重置后撤销全部旧浏览器会话、OAuth token
        和未使用授权码，并使现有登录验证码失效。不会自动登录。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
                - password
              properties:
                email: *a1
                code: &a2
                  type: string
                  pattern: ^[0-9]{6}$
                  description: 十分钟内有效的六位数字验证码，仅可使用一次。
                password:
                  type: string
                  minLength: 12
                  maxLength: 1024
                  writeOnly: true
                  description: 新密码至少 12 个字符，长度按 UTF-8 字节校验。
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - reset
                properties:
                  reset:
                    type: boolean
                    const: true
        "400":
          description: 请求无效，或验证码无效、过期、超过错误次数限制
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "401":
          description: 邮箱密码不匹配或账号不符合登录入口角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "403":
          description: 对应登录方式或注册开关关闭
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "409":
          description: 邮箱已存在，注册冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "429":
          description: 验证码发送过于频繁
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
          headers:
            Retry-After:
              schema:
                type: integer
                const: 60
        "500":
          description: 认证操作失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "502":
          description: 邮件发送失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "503":
          description: 认证配置或邮件服务不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
  /api/auth/v1/admin/login:
    post:
      summary: 使用密码登录管理后台
      description: 需要开启 password_enabled，仅允许启用状态的管理员；成功设置 HttpOnly、SameSite=Lax 会话
        Cookie，HTTPS 环境附加 Secure。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email: *a1
                password:
                  type: string
                  maxLength: 1024
                  writeOnly: true
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthUser"
          headers:
            Set-Cookie:
              schema:
                type: string
              description: monkeyai_session 会话 Cookie，默认有效期 7 天。
        "400":
          description: 请求无效，或验证码无效、过期、超过错误次数限制
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "401":
          description: 邮箱密码不匹配或账号不符合登录入口角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "403":
          description: 对应登录方式或注册开关关闭
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "409":
          description: 邮箱已存在，注册冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "429":
          description: 验证码发送过于频繁
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
          headers:
            Retry-After:
              schema:
                type: integer
                const: 60
        "500":
          description: 认证操作失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "502":
          description: 邮件发送失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "503":
          description: 认证配置或邮件服务不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
  /api/auth/v1/admin/email/login:
    post:
      summary: 使用邮箱验证码登录管理后台
      description: 需要开启 email_code_enabled，使用 login
        用途验证码。仅允许启用状态的管理员，成功建立浏览器会话；验证码最多允许 5 次错误尝试。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
              properties:
                email: *a1
                code: *a2
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthUser"
          headers:
            Set-Cookie:
              schema:
                type: string
              description: monkeyai_session 会话 Cookie，默认有效期 7 天。
        "400":
          description: 请求无效，或验证码无效、过期、超过错误次数限制
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "401":
          description: 邮箱密码不匹配或账号不符合登录入口角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "403":
          description: 对应登录方式或注册开关关闭
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "409":
          description: 邮箱已存在，注册冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "429":
          description: 验证码发送过于频繁
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
          headers:
            Retry-After:
              schema:
                type: integer
                const: 60
        "500":
          description: 认证操作失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "502":
          description: 邮件发送失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "503":
          description: 认证配置或邮件服务不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
  /api/admin/v1/settings/email/test:
    post:
      summary: 使用已保存 SMTP 配置发送测试邮件
      description: 仅管理员可调用。使用已保存的完整配置（包括未返回前端的密码）；SMTP 确认 DATA 后返回成功，连接、TLS、认证或投递失败返回 502。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - recipient
              properties:
                recipient: *a1
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - sent
                properties:
                  sent:
                    type: boolean
                    const: true
        "400":
          description: 请求无效，或验证码无效、过期、超过错误次数限制
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "401":
          description: 邮箱密码不匹配或账号不符合登录入口角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "403":
          description: 对应登录方式或注册开关关闭
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "409":
          description: 邮箱已存在，注册冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "429":
          description: 验证码发送过于频繁
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
          headers:
            Retry-After:
              schema:
                type: integer
                const: 60
        "500":
          description: 认证操作失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "502":
          description: 邮件发送失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "503":
          description: 认证配置或邮件服务不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
  /api/admin/v1/audits:
    get:
      summary: 查询操作审计
      description: 仅管理员可访问；按发生时间、ID 倒序稳定分页。支持历史记录与请求审计，时间范围左闭右开，文本筛选为不区分大小写的字面子串（IP 除外）。不提供修改或删除接口。
      parameters:
        - name: page
          in: query
          description: 页码，从 1 开始。
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: page_size
          in: query
          description: 每页条数。
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 20
        - name: actor
          in: query
          description: 操作者名称或邮箱的字面子串。
          schema:
            type: string
            maxLength: 512
        - name: ip
          in: query
          description: 实际连接来源 IP 的字面子串，不信任客户端转发头。
          schema:
            type: string
            maxLength: 512
        - name: params
          in: query
          description: 脱敏请求参数的字面子串。
          schema:
            type: string
            maxLength: 512
        - name: category
          in: query
          description: 操作分类。
          schema:
            type: string
            enum: [model, identity, security, settings, resource, billing]
        - name: result
          in: query
          description: 执行结果。
          schema:
            type: string
            enum: [success, failed]
        - name: since
          in: query
          description: 开始时间，包含该时刻。
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: 结束时间，不包含该时刻，必须晚于开始时间。
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: 匹配的审计记录与总条数；空页的 items 为 []，total 仍为匹配总数。
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "400":
          $ref: "#/components/responses/ResourceError400"
        "401":
          $ref: "#/components/responses/ResourceError401"
        "403":
          $ref: "#/components/responses/ResourceError403"
        "500":
          $ref: "#/components/responses/ResourceError500"
  /api/admin/v1/statistics/models:
    get:
      summary: 模型统计与真实环比
      description: 仅管理员可访问。单次请求在同一 PostgreSQL 只读快照中聚合，不返回模拟数据。
      parameters:
        - name: range
          in: query
          required: false
          description: 以服务端当前时间为终点的滚动窗口。
          schema:
            type: string
            enum:
              - 24h
              - 7d
              - 30d
              - 90d
            default: 30d
        - name: model_id
          in: query
          required: false
          description: 模型 UUID，省略时汇总全部模型；支持已有历史事实的软删除模型。
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 统计结果。
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticsModels"
        "400":
          $ref: "#/components/responses/ResourceError400"
        "401":
          $ref: "#/components/responses/ResourceError401"
        "403":
          $ref: "#/components/responses/ResourceError403"
        "500":
          $ref: "#/components/responses/ResourceError500"
  /api/admin/v1/statistics/tasks:
    get:
      summary: 会话统计与真实环比
      description: 仅管理员可访问。单次请求在同一 PostgreSQL 只读快照中聚合，不返回模拟数据。
      parameters:
        - name: range
          in: query
          required: false
          description: 以服务端当前时间为终点的滚动窗口。
          schema:
            type: string
            enum:
              - 24h
              - 7d
              - 30d
              - 90d
            default: 30d
      responses:
        "200":
          description: 统计结果。
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticsTasks"
        "400":
          $ref: "#/components/responses/ResourceError400"
        "401":
          $ref: "#/components/responses/ResourceError401"
        "403":
          $ref: "#/components/responses/ResourceError403"
        "500":
          $ref: "#/components/responses/ResourceError500"
  /api/admin/v1/statistics/realtime:
    get:
      summary: 实时运行统计
      description: 仅管理员可访问。单次请求在同一 PostgreSQL 只读快照中聚合，不返回模拟数据。
      parameters:
        - name: range
          in: query
          required: false
          description: 以服务端当前时间为终点的滚动窗口。
          schema:
            type: string
            enum:
              - 5m
              - 15m
              - 30m
              - 60m
            default: 15m
      responses:
        "200":
          description: 统计结果。
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticsRealtime"
        "400":
          $ref: "#/components/responses/ResourceError400"
        "401":
          $ref: "#/components/responses/ResourceError401"
        "403":
          $ref: "#/components/responses/ResourceError403"
        "500":
          $ref: "#/components/responses/ResourceError500"
  /api/admin/v1/statistics/history:
    get:
      summary: 分页查询会话历史
      description: 仅管理员可访问。单次请求在同一 PostgreSQL 只读快照中聚合，不返回模拟数据。
      parameters:
        - name: task
          in: query
          required: false
          description: 按会话标题或 UUID 包含匹配；百分号和下划线作为普通字符。
          schema:
            type: string
            maxLength: 200
        - name: user
          in: query
          required: false
          description: 按用户名或邮箱包含匹配，忽略大小写。
          schema:
            type: string
            maxLength: 200
        - name: from
          in: query
          required: false
          description: 会话开始时间下界，包含；必须携带时区。
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          description: 会话开始时间上界，不包含；必须晚于 from。日期筛选应传次日零点。
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          description: 页码。
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: page_size
          in: query
          required: false
          description: 每页条数。
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 20
      responses:
        "200":
          description: 统计结果。
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticsHistory"
        "400":
          $ref: "#/components/responses/ResourceError400"
        "401":
          $ref: "#/components/responses/ResourceError401"
        "403":
          $ref: "#/components/responses/ResourceError403"
        "500":
          $ref: "#/components/responses/ResourceError500"
  /api/admin/v1/billing/settings:
    get:
      summary: 读取计费策略与远程连接状态（不返回证书或私钥）
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  policy:
                    $ref: '#/components/schemas/BillingPolicy'
                  wallet:
                    $ref: '#/components/schemas/BillingWalletInfo'
                  timezone:
                    const: Asia/Shanghai
                  next_refresh_at:
                    type: string
                    format: date-time
        '400':
          description: 参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 修订号、幂等键或交易状态冲突
  /api/admin/v1/billing/settings/{section}:
    parameters:
    - in: path
      name: section
      schema:
        enum:
        - pricing
        - cycle
        - mode
        - wallet
      required: true
    patch:
      summary: 独立保存计价、周期、模式或百智云连接配置
      description: wallet 配置保存后无需重启，各实例在下次使用时读取。证书和私钥省略或留空时保留原值。首次保存必须提供全部证书。客户端证书与私钥须匹配且处于有效期，私钥须为 PKCS#8 ECDSA 格式。CA 须为有效的 CA 证书。环境或应用 ID 变更不能影响未完成的远程交易。校验仅在本地执行，不代表远程网络或账户权限验证成功。
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  policy:
                    $ref: '#/components/schemas/BillingPolicy'
                  wallet:
                    $ref: '#/components/schemas/BillingWalletInfo'
                  timezone:
                    const: Asia/Shanghai
                  next_refresh_at:
                    type: string
                    format: date-time
        '400':
          description: 参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 修订号冲突，或未完成远程交易阻止环境或应用 ID 变更
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 启用远程模式前须先配置有效证书
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  revision:
                    type: integer
                  input_credits_per_million_tokens:
                    $ref: '#/components/schemas/CreditAmount'
                  cached_input_credits_per_million_tokens:
                    $ref: '#/components/schemas/CreditAmount'
                  output_credits_per_million_tokens:
                    $ref: '#/components/schemas/CreditAmount'
                required:
                - revision
                - input_credits_per_million_tokens
                - cached_input_credits_per_million_tokens
                - output_credits_per_million_tokens
              - type: object
                properties:
                  revision:
                    type: integer
                  quota_refresh_cycle:
                    enum:
                    - daily
                    - weekly
                    - monthly
                required:
                - revision
                - quota_refresh_cycle
              - type: object
                properties:
                  revision:
                    type: integer
                  charging_mode:
                    enum:
                    - local
                    - remote
                  enabled:
                    type: boolean
                required:
                - revision
                - charging_mode
                - enabled
              - $ref: '#/components/schemas/BillingWalletInput'
