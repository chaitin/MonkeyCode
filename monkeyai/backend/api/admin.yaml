components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: monkeyai_session
      description: 管理后台登录后设置的 HttpOnly Session Cookie。
  parameters:
    ModelID:
      in: path
      name: modelID
      required: true
      description: 模型 UUID。
      schema:
        type: string
        format: uuid
    KeyID:
      in: path
      name: keyID
      required: true
      description: 调用密钥 UUID。
      schema:
        type: string
        format: uuid
  responses:
    ResourceError400:
      description: 字段或关联无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError401:
      description: 需要登录
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError403:
      description: 无权操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError404:
      description: 资源不存在或无权访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError409:
      description: 名称或引用冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError412:
      description: 修订或技能包摘要已变化
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError428:
      description: 缺少 If-Match
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError500:
      description: 读取或保存失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError502:
      description: 上游连接失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    BadRequest:
      description: 请求参数或请求体无效。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 未登录或 Session 已失效。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 当前用户没有管理员权限。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 指定资源不存在。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: 服务内部错误。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    EmailAuthError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
    EmailLoginMethods:
      type: object
      required:
        - password_enabled
        - email_code_enabled
        - registration_enabled
      properties:
        password_enabled:
          type: boolean
          description: 密码登录开关，未配置时默认 true，同时约束管理员和普通用户。
        email_code_enabled:
          type: boolean
          description: 验证码登录开关，默认 false。
        registration_enabled:
          type: boolean
          description: 自助注册开关，默认 false。
    EmailAuthUser:
      type: object
      required:
        - id
        - name
        - email
        - role
        - status
        - joined_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
          maxLength: 254
          description: 邮箱会去除首尾空白并转为小写。
        role:
          type: string
          enum:
            - admin
            - user
        status:
          type: string
          enum:
            - active
            - disabled
        joined_at:
          type: string
          format: date-time
        avatar_url:
          type: string
        last_login_at:
          type: string
          format: date-time
    AuditPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditRecord"
        total:
          type: integer
          minimum: 0
          description: 所有匹配记录的数量。
        page:
          type: integer
          minimum: 1
          description: 请求页码。
        page_size:
          type: integer
          minimum: 1
          maximum: 500
          description: 每页条数。
    AuditRecord:
      type: object
      required: [id, actor_type, actor_user_id, actor_name, actor_email, action, category, target_type, target_id, request_params, source_ip, user_agent, result, error_message, occurred_at, request_id]
      properties:
        id:
          type: string
          description: "审计 ID。"
          format: uuid
        actor_type:
          type: string
          description: "操作者类型；登录失败是尚未认证的 user。"
          enum: [user, system]
        actor_user_id:
          type: [string, "null"]
          description: "操作者 ID；未认证用户及已删除用户为空。"
          format: uuid
        actor_name:
          type: string
          description: "操作者名称快照，未认证登录尝试固定为未认证用户。"
        actor_email:
          type: [string, "null"]
          description: "操作者邮箱快照。"
        action:
          type: string
          description: "操作标识；客户端应为未知标识保留原文回退。"
        category:
          type: string
          description: "操作分类，兼容既有记录。"
        target_type:
          type: [string, "null"]
          description: "目标资源类型。"
        target_id:
          type: [string, "null"]
          description: "目标 UUID；无具体对象时为空。"
          format: uuid
        request_params:
          type: object
          description: "白名单参数快照，未知字段与凭证替换为 [REDACTED]；不保存上传文件、正文及原始响应。"
          additionalProperties: true
        source_ip:
          type: [string, "null"]
          description: "HTTP 对端 IPv4 或 IPv6 地址，历史记录可为空。"
        user_agent:
          type: [string, "null"]
          description: "最多 512 个字符的客户端标识。"
        result:
          type: string
          description: "执行结果。"
          enum: [success, failed]
        error_message:
          type: [string, "null"]
          description: "仅保存标准 HTTP 状态说明，不保存上游或数据库错误原文。"
        occurred_at:
          type: string
          description: "操作发生时间。"
          format: date-time
        request_id:
          type: [string, "null"]
          description: "服务端生成的请求关联标识，同一批量操作可关联多个目标；历史或独立业务事件为空。"
    StatisticsModelSummary:
      type: object
      required:
        - calls
        - input_tokens
        - output_tokens
        - cache_hit_rate
        - success_rate
        - credits
      properties:
        calls:
          type: integer
          minimum: 0
          description: 按开始时间计数，包含成功、失败和取消调用。
        input_tokens:
          type: integer
          minimum: 0
          description: 输入 Token 总量，包含缓存输入。
        output_tokens:
          type: integer
          minimum: 0
          description: 输出 Token 总量。
        cache_hit_rate:
          type:
            - number
            - "null"
          description: 命中缓存的调用次数 / 调用总数 × 100；没有调用时为 null。
        success_rate:
          type:
            - number
            - "null"
          description: 成功调用 / 已结束调用 × 100；没有已结束调用时为 null。
        credits: &a1
          type: string
          pattern: ^-?[0-9]+(\.[0-9]{1,6})?$
          description: 扣费减退款后的积分净消费，十进制字符串；纯退款周期可为负值。
    StatisticsModels:
      type: object
      required:
        - from
        - until
        - summary
        - previous
        - models
        - trend
      properties:
        from: &a2
          type: string
          format: date-time
          description: 查询窗口起点，包含。
        until: &a3
          type: string
          format: date-time
          description: 查询窗口终点，不包含；由服务端统一确定。
        summary:
          $ref: "#/components/schemas/StatisticsModelSummary"
        previous:
          $ref: "#/components/schemas/StatisticsModelSummary"
          description: 紧邻当前窗口之前的等长周期。
        models:
          type: array
          items:
            type: object
            required:
              - id
              - name
              - deleted
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
                description: 模型显示名。
              deleted:
                type: boolean
                description: 模型是否已软删除；历史调用和消费仍保留。
        trend:
          type: array
          items:
            type: object
            required:
              - at
              - calls
              - input_tokens
              - output_tokens
              - credits
            properties:
              at:
                type: string
                format: date-time
                description: 分桶起点，从窗口起点每 1 小时（24h）或 24 小时递增，不按自然日对齐；空桶补零。
              calls:
                type: integer
                minimum: 0
                description: 本桶调用数。
              input_tokens:
                type: integer
                minimum: 0
                description: 本桶输入 Token。
              output_tokens:
                type: integer
                minimum: 0
                description: 本桶输出 Token。
              credits: *a1
    StatisticsTaskSummary:
      type: object
      required:
        - total
        - completed
        - failed
        - running
        - completion_rate
        - average_duration_seconds
      properties:
        total:
          type: integer
          minimum: 0
          description: 窗口内新建且未软删除的会话总数。
        completed:
          type: integer
          minimum: 0
          description: 已结束且失败代码、失败描述均为空的会话数。
        failed:
          type: integer
          minimum: 0
          description: 已结束且失败代码或失败描述非空的会话数，包含异常取消。
        running:
          type: integer
          minimum: 0
          description: 尚未结束的会话数，可能处于空闲状态。
        completion_rate:
          type:
            - number
            - "null"
          description: 成功结束数 / 会话总数 × 100；无会话时为 null。
        average_duration_seconds:
          type:
            - number
            - "null"
          description: 已结束会话的平均耗时，单位秒；没有已结束会话时为 null。
    StatisticsTasks:
      type: object
      required:
        - from
        - until
        - summary
        - previous
        - trend
        - types
      properties:
        from: *a2
        until: *a3
        summary:
          $ref: "#/components/schemas/StatisticsTaskSummary"
        previous:
          $ref: "#/components/schemas/StatisticsTaskSummary"
          description: 紧邻当前窗口之前的等长周期，按会话当前结果汇总。
        trend:
          type: array
          items:
            type: object
            required:
              - at
              - completed
              - failed
              - running
            properties:
              at:
                type: string
                format: date-time
                description: 分桶起点，从窗口起点每 1 小时（24h）或 24 小时递增；按会话开始时间归桶，空桶补零。
              completed:
                type: integer
                minimum: 0
                description: 本桶成功结束数。
              failed:
                type: integer
                minimum: 0
                description: 本桶失败数。
              running:
                type: integer
                minimum: 0
                description: 本桶未结束数。
        types:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/StatisticsTaskSummary"
              - type: object
                required:
                  - key
                properties:
                  key:
                    type: string
                    enum:
                      - conversation
                      - workflow
                      - tool
                      - scheduled
    StatisticsRealtime:
      type: object
      required:
        - from
        - until
        - model_consumption
        - p95_response_time
        - model_success_rate
        - model_calls
        - tpm
        - rpm
        - input_tokens
        - output_tokens
        - active_users
        - active_tasks
        - new_tasks
      properties:
        from: *a2
        until: *a3
        model_consumption: *a1
        p95_response_time:
          type:
            - number
            - "null"
          description: 窗口内完成的模型调用响应耗时 P95，单位毫秒；优先使用记录的耗时，否则使用完成时间减开始时间。无样本为 null。
        model_success_rate:
          type:
            - number
            - "null"
          description: 窗口内成功调用 / 已结束调用 × 100；取消计入分母，无样本为 null。
        model_calls:
          type: integer
          minimum: 0
          description: 窗口内完成的模型调用总数。
        tpm:
          type: number
          description: 窗口内完成调用的输入加输出 Token 总量 / 窗口分钟数。
        rpm:
          type: number
          description: 窗口内完成调用总数 / 窗口分钟数。
        input_tokens:
          type: integer
          minimum: 0
          description: 窗口内完成调用的输入 Token，包含缓存输入。
        output_tokens:
          type: integer
          minimum: 0
          description: 窗口内完成调用的输出 Token。
        active_users:
          type: integer
          minimum: 0
          description: 窗口内完成模型或 MCP 调用、有会话活动或发起仍在执行的计费调用的去重用户数；并非登录 DAU。
        active_tasks:
          type: integer
          minimum: 0
          description: 最近活动时间在窗口内且未结束、未删除的会话数。
        new_tasks:
          type: integer
          minimum: 0
          description: 窗口内创建且未删除的会话数。
    StatisticsHistory:
      type: object
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - id
              - title
              - user_name
              - user_email
              - started_at
              - last_active_at
              - turn_count
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
                description: 会话标题。
              user_name:
                type: string
                description: 所属用户当前姓名。
              user_email:
                type: string
                description: 所属用户当前邮箱。
              started_at:
                type: string
                format: date-time
                description: 会话开始时间。
              last_active_at:
                type: string
                format: date-time
                description: 最近活动时间。
              turn_count:
                type: integer
                minimum: 0
                description: 会话累计对话轮数；不表示筛选窗口内新增轮数。
        total:
          type: integer
          minimum: 0
          description: 符合筛选条件的总记录数。
        page:
          type: integer
          minimum: 1
          description: 实际页码；超过最后一页时回退到最后一页。
        page_size:
          type: integer
          minimum: 1
          maximum: 500
    CreateMemberGroupInput:
      allOf:
        - $ref: "#/components/schemas/MemberGroupInput"
        - type: object
          required: [name]
    MemberGroupMembersInput:
      type: object
      required: [member_ids]
      properties:
        member_ids:
          type: array
          maxItems: 10000
          description: 完整的直接成员 ID 列表，空数组表示清空，重复 ID 自动去重；用户须存在且未删除。
          items:
            type: string
            format: uuid
    MemberGroupInput:
      type: object
      minProperties: 1
      anyOf:
        - required: [name]
        - required: [parent_id]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 去除首尾空白后不能为空；同级名称不区分大小写且不能重复。
        parent_id:
          type: [string, "null"]
          format: uuid
          description: 新上级分组 ID，必须是有效分组；null 表示团队根节点，更新时省略则保留原值。
    MemberGroupsResponse:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          description: 未删除的分组列表，按创建时间和 ID 排序。
          items:
            $ref: "#/components/schemas/MemberGroup"
    MemberGroup:
      type: object
      required: [id, parent_id, name, member_ids]
      properties:
        id:
          type: string
          format: uuid
          description: 分组唯一标识。
        parent_id:
          type: [string, "null"]
          format: uuid
          description: 上级分组 ID；null 表示该分组直属团队根节点。
        name:
          type: string
          description: 分组显示名称。
        member_ids:
          type: array
          description: 未删除用户的直接分组关系，不含子分组成员，也不按用户角色自动分配。
          items:
            type: string
            format: uuid
    CreditAmount:
      type: string
      pattern: ^-?\d+(\.\d{1,6})?$
      description: 十进制定点积分，最多六位小数。
    BillingPrice:
      type: object
      properties:
        input:
          $ref: '#/components/schemas/CreditAmount'
        cached:
          $ref: '#/components/schemas/CreditAmount'
        output:
          $ref: '#/components/schemas/CreditAmount'
        multiplier:
          $ref: '#/components/schemas/CreditAmount'
        tool:
          $ref: '#/components/schemas/CreditAmount'
    BillingPolicy:
      type: object
      properties:
        root_credits:
          $ref: "#/components/schemas/CreditAmount"
        revision:
          type: integer
        enabled:
          type: boolean
        charging_mode:
          enum:
          - local
          - remote
        quota_refresh_cycle:
          enum:
          - daily
          - weekly
          - monthly
        pending_cycle:
          enum:
          - daily
          - weekly
          - monthly
        cycle_effective_at:
          type: string
          format: date-time
        cycle_anchor:
          type: string
          format: date-time
        input_credits_per_million_tokens:
          $ref: '#/components/schemas/CreditAmount'
        cached_input_credits_per_million_tokens:
          $ref: '#/components/schemas/CreditAmount'
        output_credits_per_million_tokens:
          $ref: '#/components/schemas/CreditAmount'
      required:
      - revision
      - enabled
      - charging_mode
      - quota_refresh_cycle
    BillingWalletInput:
      type: object
      additionalProperties: false
      required:
      - revision
      - environment
      - app_id
      properties:
        revision:
          type: integer
          description: 当前计费策略修订号；保存连接配置会递增该修订号。
        environment:
          type: string
          enum: [dev, prod]
          description: 百智云测试或生产环境。
        app_id:
          type: integer
          minimum: 1
          maximum: 999
          description: 所选环境对应的百智云应用 ID。
        certificate:
          type: string
          maxLength: 65536
          writeOnly: true
          description: 客户端证书 PEM 内容，首次配置必填，省略或空字符串保留已保存值。
        private_key:
          type: string
          maxLength: 65536
          writeOnly: true
          description: PKCS#8 ECDSA 私钥 PEM 内容，首次配置必填，省略或空字符串保留已保存值；不回显、不写入审计明文。
        ca_certificate:
          type: string
          maxLength: 65536
          writeOnly: true
          description: 服务端根 CA 证书 PEM 内容，首次配置必填，省略或空字符串保留已保存值。
    BillingWalletInfo:
      type: object
      description: 仅返回连接元信息；configured 表示本地证书校验通过，不代表远程网络连通或账户授权成功。
      properties:
        configured:
          type: boolean
        credentials_configured:
          type: boolean
          description: 是否已有完整证书和私钥；为 true 时更新配置可以省略对应文件。
        environment:
          enum:
          - dev
          - prod
        app_id:
          type: integer
          minimum: 1
          maximum: 999
        certificate_expires_at:
          type: string
          format: date-time
        source:
          type: string
          enum: [admin, environment]
          description: 当前使用后台保存的配置或部署环境配置；后台配置优先。
        error:
          type: string
          description: 配置无效或证书过期时的提示，不包含凭证原文。
      required:
      - configured
      - credentials_configured
    CreditAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        group_id:
          type: string
          description: 计费分组 UUID；未指定归属时为空字符串。
        period_start_at:
          type: string
          format: date-time
        period_end_at:
          type: string
          format: date-time
        balance:
          $ref: '#/components/schemas/CreditAmount'
        frozen:
          $ref: '#/components/schemas/CreditAmount'
        available:
          $ref: '#/components/schemas/CreditAmount'
        quota:
          $ref: '#/components/schemas/CreditAmount'
      required:
      - id
      - user_id
      - balance
      - frozen
      - available
      - quota
      - period_start_at
      - period_end_at
    CreditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        transaction_id:
          type:
          - string
          - 'null'
          format: uuid
        user_id:
          type: string
          format: uuid
        user_name:
          type: string
        user_email:
          type: string
        item_name:
          type: string
        category:
          enum:
          - model
          - tool
          - other
        entry_type:
          enum:
          - grant
          - charge
          - refund
          - adjustment
          - reset
        credit_delta:
          $ref: '#/components/schemas/CreditAmount'
        balance_after:
          $ref: '#/components/schemas/CreditAmount'
        mode:
          enum:
          - local
          - remote
        sequence:
          type: string
        occurred_at:
          type: string
          format: date-time
        metadata:
          type: object
    BillingUsage:
      type: object
      properties:
        known:
          type: boolean
        result:
          enum:
          - succeeded
          - failed
          - cancelled
        request_id:
          type: string
        error_code:
          type: string
        input_tokens:
          type: integer
          minimum: 0
        cached_input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
      required:
      - result
    BillingTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        user_name:
          type: string
        user_email:
          type: string
        item_name:
          type: string
        account_id:
          type: string
          format: uuid
        session_id:
          type:
          - string
          - 'null'
          format: uuid
        category:
          enum:
          - model
          - tool
        mode:
          enum:
          - local
          - remote
        status:
          enum:
          - created
          - reserved
          - running
          - settling
          - settled
          - released
          - rejected
          - unknown
        reserve:
          $ref: '#/components/schemas/CreditAmount'
        amount:
          anyOf:
          - $ref: '#/components/schemas/CreditAmount'
          - type: 'null'
        raw_amount:
          anyOf:
          - $ref: '#/components/schemas/CreditAmount'
          - type: 'null'
        pricing:
          $ref: '#/components/schemas/BillingPrice'
        usage:
          $ref: '#/components/schemas/BillingUsage'
        error_code:
          type: string
        attempts:
          type: integer
        started_at:
          type: string
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CreditEntry'
        wallet_records:
          type: array
          items:
            type: object
            properties:
              biz_id:
                type: string
              status:
                type: string
              external_user_id:
                type: string
              environment:
                type: string
              app_id:
                type: integer
              frozen_amount_quota:
                type: string
              actual_amount_quota:
                type:
                - string
                - 'null'
              trace_id:
                type: string
              error_code:
                type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 供调用方识别错误类别的稳定代码。
          examples: [model_error]
        message:
          type: string
          description: 面向用户或开发者的错误说明。
    ModelsResponse:
      type: object
      required: [models]
      properties:
        models:
          type: array
          description: 按创建时间倒序排列的模型。
          items:
            $ref: "#/components/schemas/Model"
    Model:
      type: object
      required:
        - id
        - ownership_type
        - owner_user_id
        - model_id
        - display_name
        - protocol
        - base_url
        - api_key_configured
        - advanced_config
        - credit_multiplier
        - authorization
        - enabled
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: MonkeyAI 内部模型 ID，也是 Agent 调用时使用的 model 值。
        ownership_type:
          type: string
          enum: [system, user]
          description: system 表示管理员配置的系统模型，user 表示用户自带模型。
        owner_user_id:
          type: string
          format: uuid
          description: 模型所有者的用户 ID。
        model_id:
          type: string
          description: 上游服务使用的模型标识。
        display_name:
          type: string
          description: 管理后台和 Agent 展示的模型名称。
        protocol:
          $ref: "#/components/schemas/ModelProtocol"
        base_url:
          type: string
          format: uri
          description: 上游模型服务的 HTTP(S) 基础地址。
        api_key_configured:
          type: boolean
          description: 是否已配置上游 API Key；响应不会返回密钥原文。
        advanced_config:
          $ref: "#/components/schemas/AdvancedConfig"
        credit_multiplier:
          type: number
          exclusiveMinimum: 0
          description: 本模型消耗积分时使用的倍率。
        authorization:
          $ref: "#/components/schemas/Authorization"
        enabled:
          type: boolean
          description: 模型是否允许被调用。
        created_at:
          type: string
          format: date-time
          description: 模型创建时间。
        updated_at:
          type: string
          format: date-time
          description: 模型最后更新时间。
    ModelProtocol:
      type: string
      enum: [openai_chat_completions, openai_responses, anthropic]
      description: MonkeyAI 与上游服务通信时使用的协议。
    AdvancedConfig:
      type: object
      required: [context_window_tokens, max_output_tokens, supports_vision]
      properties:
        context_window_tokens:
          type: integer
          format: int64
          minimum: 1
          description: 模型上下文窗口的最大 Token 数。
        max_output_tokens:
          type: integer
          format: int64
          minimum: 1
          description: 单次请求允许生成的最大 Token 数。
        supports_vision:
          type: boolean
          description: 模型是否支持图像输入。
    Authorization:
      type: object
      description: 可使用该模型的用户和分组；须选择全员授权，或在两个数组中至少指定一项。全员授权包含后续新增用户，启用时忽略用户和分组数组。
      required: [user_ids, group_ids]
      properties:
        all_users:
          type: boolean
          default: false
          description: 是否授权给全体用户；界面通过选择虚拟根节点表达，不引用分组记录。
        user_ids:
          type: array
          description: 获得模型访问权的用户 UUID。
          uniqueItems: true
          items:
            type: string
            format: uuid
        group_ids:
          type: array
          description: 获得模型访问权的分组 UUID。
          uniqueItems: true
          items:
            type: string
            format: uuid
    ModelInput:
      type: object
      required:
        - model_id
        - display_name
        - protocol
        - base_url
        - advanced_config
        - credit_multiplier
        - authorization
      properties:
        model_id:
          type: string
          minLength: 1
          description: 上游服务使用的模型标识。
        display_name:
          type: string
          minLength: 1
          description: 模型展示名称。
        protocol:
          $ref: "#/components/schemas/ModelProtocol"
        base_url:
          type: string
          format: uri
          pattern: "^https?://"
          description: 上游模型服务的 HTTP(S) 基础地址。
        api_key:
          type: string
          description: 上游 API Key；更新时传空字符串可保留原密钥。
        advanced_config:
          $ref: "#/components/schemas/AdvancedConfig"
        credit_multiplier:
          type: number
          exclusiveMinimum: 0
          description: 积分消耗倍率。
        authorization:
          $ref: "#/components/schemas/Authorization"
    CreateModelInput:
      allOf:
        - $ref: "#/components/schemas/ModelInput"
        - type: object
          required: [api_key]
          properties:
            api_key:
              type: string
              minLength: 1
              description: 上游 API Key，创建时不能为空。
    SetModelEnabledInput:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: true 为启用模型，false 为停用模型。
    AuthorizationSubjects:
      type: object
      required: [groups, users]
      properties:
        groups:
          type: array
          description: 可授权的分组。
          items:
            $ref: "#/components/schemas/GroupSubject"
        users:
          type: array
          description: 可授权的活跃用户。
          items:
            $ref: "#/components/schemas/UserSubject"
    GroupSubject:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          description: 分组 ID。
        parent_id:
          type: string
          format: uuid
          description: 父分组 ID；根分组不返回该字段。
        name:
          type: string
          description: 分组名称。
    UserSubject:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
          description: 用户 ID。
        name:
          type: string
          description: 用户显示名称。
        email:
          type: string
          format: email
          description: 用户邮箱。
    APIKeysResponse:
      type: object
      required: [api_keys]
      properties:
        api_keys:
          type: array
          description: 调用密钥元数据，不包含可用于鉴权的密钥原文。
          items:
            $ref: "#/components/schemas/APIKey"
    APIKey:
      type: object
      required:
        - id
        - user_id
        - name
        - key_prefix
        - scopes
        - expires_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: 调用密钥 ID。
        user_id:
          type: string
          format: uuid
          description: 密钥所属用户 ID。
        user_name:
          type: string
          description: 密钥所属用户的显示名称。
        name:
          type: string
          description: 用户设置的密钥名称。
        key_prefix:
          type: string
          description: 用于识别密钥的安全前缀，不可用于鉴权。
          examples: [mk_abcd1234]
        scopes:
          type: array
          description: 密钥具备的调用权限。
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: ["model:invoke", "mcp:invoke"]
        expires_at:
          type: string
          format: date-time
          description: 密钥过期时间。
        last_used_at:
          type: string
          format: date-time
          description: 最近一次成功使用时间；从未使用时不返回。
        created_at:
          type: string
          format: date-time
          description: 密钥创建时间。
        revoked_at:
          type: string
          format: date-time
          description: 密钥撤销时间；尚未撤销时不返回。

    ResourceGrant:
      type: object
      description: 每条授权必须且只能选择用户、分组或全体用户之一。全员授权仅用于系统资源，包含后续新增用户，user_id 和 group_id 须为空或省略。
      properties:
        all_users:
          type: boolean
          default: false
          description: 是否授权给全体用户；省略时按 false 处理。
        user_id:
          type:
          - string
          - 'null'
          format: uuid
        group_id:
          type:
          - string
          - 'null'
          format: uuid
        usage_requirement:
          type: string
          enum:
          - optional
          - required
          description: 仅系统规则可设置 required。
      required:
      - usage_requirement
