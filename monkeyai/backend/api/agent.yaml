components:
  securitySchemes:
    InvocationKey:
      type: http
      scheme: bearer
      description: 含 mcp:invoke 的长期调用密钥。
    OAuthAccessToken:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
      description: Agent 登录授权流程签发的短期 access token。
  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 最近详情响应中的修订号 ETag，例如 "1"；缺省返回 428，已过期返回 412。
      schema:
        type: string
    IfNoneMatch:
      in: header
      name: If-None-Match
      description: 此接口上一次响应的 ETag；当前用户可见内容未变化时返回 304。
      schema:
        type: string
    KeyID:
      in: path
      name: keyID
      required: true
      description: 调用密钥 UUID。
      schema:
        type: string
        format: uuid
  headers:
    RevisionETag:
      description: 资源修订号，以双引号包围，例如 "1"；创建、编辑、分享、撤销分享及删除都会更新修订号。
      schema:
        type: string
    ETag:
      description: 当前接口响应内容的稳定 SHA-256 版本，以双引号包围。
      schema:
        type: string
    CacheControl:
      description: 按用户隔离缓存，每次使用前重新验证。
      schema:
        type: string
        const: private, no-cache
  responses:
    NotModified:
      description: 当前接口内容未变化，无响应体。
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
    ResourceError400:
      description: 字段或关联无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError401:
      description: 需要登录
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError403:
      description: 无权操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError404:
      description: 资源不存在或无权访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError409:
      description: 名称或引用冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError412:
      description: 修订或技能包摘要已变化
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError428:
      description: 缺少 If-Match
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError500:
      description: 读取或保存失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError502:
      description: 上游连接失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    BadRequest:
      description: 请求参数或请求体无效。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 缺少 access token，或 token 无效、已过期。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 指定资源不存在或不属于当前用户。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: 服务内部错误。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    UserRuleInput:
      type: object
      properties:
        content:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - name
      - content
      description: 仅声明的字段可由当前用户写入；归属、启用状态、授权和其他服务端字段忽略。
    UserSkillInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          description: 省略时保留原值。
        content:
          type: string
          description: 省略时保留原值。
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - name
      description: 仅声明的字段可由当前用户写入；归属、启用状态、授权和其他服务端字段忽略。
    UserExpertInput:
