            $ref: '#/components/schemas/AgentConnector'
    AgentSettings:
      type: object
      description: 按设置域组织的全局设置；只返回已配置的设置域，服务端密钥字段已移除。
      properties:
        branding:
          $ref: "#/components/schemas/BrandingSettings"
        authentication:
          $ref: "#/components/schemas/AuthenticationSettings"
        email:
          $ref: "#/components/schemas/EmailSettings"
        billing:
          $ref: "#/components/schemas/BillingSettings"
      additionalProperties:
        type: object
        description: 后续新增设置域的配置对象。
    BrandingSettings:
      type: object
      required: [workspace_name, product_name]
      properties:
        workspace_name:
          type: string
          description: 工作区名称。
        product_name:
          type: string
          description: Agent 向用户展示的产品名称。
      additionalProperties: true
    AuthenticationSettings:
      type: object
      properties:
        registration_enabled:
          type: boolean
          description: 是否允许新用户注册。
        password_enabled:
          type: boolean
          description: 是否允许密码登录。
        email_code_enabled:
          type: boolean
          description: 是否允许邮箱验证码登录。
        oauth_connections:
          type: array
          description: 已配置的 OAuth 登录连接；不包含 client_secret。
          items:
            $ref: "#/components/schemas/OAuthConnection"
      additionalProperties: true
    OAuthConnection:
      type: object
      required: [id, provider, name, client_id, enabled]
      properties:
        id:
          type: string
          description: OAuth 连接的稳定标识。
        provider:
          type: string
          enum: [github, google, microsoft, gitlab, oidc, baizhiyun]
          description: OAuth 或 OIDC 提供方。
        name:
          type: string
          description: 登录界面展示的连接名称。
        client_id:
          type: string
          description: OAuth Client ID。
        issuer_url:
          type: string
          format: uri
          description: OIDC Issuer URL；oidc 和 baizhiyun 必填，其他连接可不返回。
        authorization_url:
          type: string
          format: uri
          description: 自定义授权端点；使用提供方默认端点时可不返回。
        token_url:
          type: string
          format: uri
          description: 自定义 Token 端点；使用提供方默认端点时可不返回。
        userinfo_url:
          type: string
          format: uri
          description: 自定义用户信息端点；使用提供方默认端点时可不返回。
        scopes:
          type: array
          description: 请求上游授权时使用的 Scope；使用默认 Scope 时可不返回。百智云默认为 auth_certification、openid、phone、user、email。
          items:
            type: string
        enabled:
          type: boolean
          description: 此登录连接是否启用。
      additionalProperties: true
    EmailSettings:
      type: object
      properties:
        sender_name:
          type: string
          description: 邮件发件人名称。
        sender_email:
          type: string
          format: email
          description: 邮件发件人地址。
        smtp_host:
          type: string
          description: SMTP 服务器主机名。
        smtp_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: SMTP 服务器端口。
        smtp_username:
          type: string
          description: SMTP 登录用户名。
        smtp_encryption:
          type: string
          enum: [none, starttls, tls]
          description: SMTP 连接加密方式。
      additionalProperties: true
    BillingSettings:
      type: object
      properties:
        input_credits_per_million_tokens:
          $ref: '#/components/schemas/CreditAmount'
          description: 每百万输入 Token 消耗的积分。
        cached_input_credits_per_million_tokens:
          $ref: '#/components/schemas/CreditAmount'
          description: 每百万缓存输入 Token 消耗的积分。
        output_credits_per_million_tokens:
          $ref: '#/components/schemas/CreditAmount'
          description: 每百万输出 Token 消耗的积分。
        quota_refresh_cycle:
          type: string
          enum:
          - daily
          - weekly
          - monthly
          description: 积分额度刷新周期。
        charging_mode:
          description: local 为本地扣费；remote 为百智云扣费，仅具有有效百智云登录身份的用户可访问系统资源，用户自建资源仍遵循原授权。
          type: string
          enum:
          - local
          - remote
        enabled:
          type: boolean
          description: 是否启用计费。
      additionalProperties: false
    ModelGateway:
      type: object
      required: [base_url, authentication]
      properties:
        base_url:
          type: string
          format: uri
          description: 兼容模型 SDK 的代理 Base URL。
        authentication:
          type: string
          enum: [api_key]
          description: 模型代理使用用户创建的调用密钥鉴权。
    AgentModel:
      type: object
      required:
        - ownership_type
        - user
        - id
        - model
        - display_name
        - protocol
        - context_window_tokens
        - max_output_tokens
        - supports_vision
        - credit_multiplier
      properties:
        ownership_type:
          type: string
          enum:
          - system
          - user
          description: 资源归属，固定为 system 或 user；分享不会改变此值。自有和他人分享的个人模型均为 user，通过 user.id 与当前用户 ID 比较区分。
        user:
          $ref: '#/components/schemas/UserSummary'
          readOnly: true
          description: 资源所有者的基本信息；系统资源返回创建者，分享不改变归属。
        creator:
          $ref: '#/components/schemas/UserSummary'
          description: 他人创建的用户模型返回创建者；自己的模型和系统模型不返回。
        shared_users:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
          description: 仅自己的用户模型返回分享用户列表，未分享时为空数组，排除已删除用户。接收方和系统模型不返回此字段。
        id:
          type: string
          format: uuid
          description: MonkeyAI 内部模型 UUID，模型代理兼容使用该值作为请求的 model。
        model:
          type: string
          description: 数据库 models.model_id 中配置的模型名称，Agent 调用模型代理时作为请求的 model 值。
        display_name:
          type: string
          description: Agent 向用户展示的模型名称。
        protocol:
          type: string
          enum: [openai_chat_completions, openai_responses, anthropic]
          description: MonkeyAI 与上游服务通信时使用的协议。
        context_window_tokens:
          type: integer
          format: int64
          minimum: 1
          description: 模型上下文窗口的最大 Token 数。
        max_output_tokens:
          type: integer
          format: int64
          minimum: 1
          description: 单次请求允许生成的最大 Token 数。
        supports_vision:
          type: boolean
          description: 模型是否支持图像输入。
        credit_multiplier:
          type: number
          exclusiveMinimum: 0
          description: 本模型消耗积分时使用的倍率。
    APIKeysResponse:
      type: object
      required: [api_keys]
      properties:
        api_keys:
          type: array
          description: 当前用户的调用密钥元数据，不包含可用于鉴权的密钥原文。
          items:
            $ref: "#/components/schemas/APIKey"
    CreateAPIKeyInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          description: 便于用户识别密钥用途的名称。
        scopes:
          type: array
          description: 调用权限；不传或传空数组时默认为 model:invoke。
          default:
          - model:invoke
          uniqueItems: true
          items:
            type: string
            enum:
            - model:invoke
            - mcp:invoke
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
          description: 密钥自创建时起的有效天数。
      additionalProperties: false
      description: 创建全局调用密钥；MCP 使用 mcp:invoke scope，无需绑定连接或凭证，具体资源访问权由代理地址及用户权限决定。
    APIKey:
      type: object
      required:
      - id
      - user_id
      - name
      - key_prefix
      - scopes
      - expires_at
      - created_at
      properties:
        id:
          type: string
          format: uuid
          description: 调用密钥 ID。
        user_id:
          type: string
          format: uuid
          description: 密钥所属用户 ID。
        user_name:
          type: string
          description: 密钥所属用户的显示名称。
        name:
          type: string
          description: 用户设置的密钥名称。
        key_prefix:
          type: string
          description: 用于识别密钥的安全前缀，不可用于鉴权。
          examples:
          - mk_abcd1234
        scopes:
          type: array
          description: 密钥具备的调用权限。
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - model:invoke
            - mcp:invoke
        expires_at:
          type: string
          format: date-time
          description: 密钥过期时间。
        last_used_at:
          type: string
          format: date-time
          description: 最近一次成功使用时间；从未使用时不返回。
        created_at:
          type: string
          format: date-time
          description: 密钥创建时间。
        revoked_at:
          type: string
          format: date-time
          description: 密钥撤销时间；尚未撤销时不返回。
