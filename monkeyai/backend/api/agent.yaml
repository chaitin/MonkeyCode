        "500":
          description: 认证操作失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "502":
          description: 邮件发送失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "503":
          description: 认证配置或邮件服务不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
