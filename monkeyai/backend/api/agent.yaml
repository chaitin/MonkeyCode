openapi: 3.1.0
info:
  title: MonkeyAI Agent API
  version: 1.0.0
security:
  - OAuthAccessToken: []
paths:
  /api/v1/billing/account:
    get:
      summary: 查询当前用户周期余额和冻结额
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditAccount'
        '400':
          description: 参数不合法
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 修订号、幂等键或交易状态冲突
  /mcp/connectors/{id}:
    parameters:
    - in: path
      name: id
      schema:
        type: string
        format: uuid
      required: true
    post:
      summary: MCP 执行网关：集中认证成功调用计费
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    const: '2.0'
                  id: {}
                  result: {}
                  error: {}
        '400':
          description: 参数不合法
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 修订号、幂等键或交易状态冲突
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  const: '2.0'
                id: {}
                method:
                  enum:
                  - initialize
                  - notifications/initialized
                  - ping
                  - tools/list
                  - tools/call
                params:
                  type: object
              required:
              - jsonrpc
              - method
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
      - in: header
        name: X-Session-ID
        schema:
          type: string
          format: uuid
      security:
      - InvocationKey: []
      description: Bearer 长期调用密钥必须包含 mcp:invoke。响应 X-Billing-Transaction-ID 用于查询。结果不确定保持冻结，不自动重放上游。
  /api/v1/users:
    get:
      summary: 按用户名或邮箱查找分享接收用户
      description: 不区分大小写的字面子串匹配，仅返回有效用户，排除当前用户。用户名对应用户的 name 字段。按名称和 ID 排序，最多返回 limit 项；结果过多时请细化关键词。
      parameters:
      - in: query
        name: q
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
        description: 去除首尾空白后长度为 1—200 字节。
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: 匹配的用户简要信息。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchUsersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/models:
    get:
      summary: 查询当前用户可用的模型
      description: 与配置快照的 models 一致，仅包含启用的系统授权模型、自有模型和收到分享的模型。
      responses:
        '200':
          description: 可用模型，不含上游地址和密钥。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModelsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: 创建当前用户的个人模型
      description: 所有者由登录身份确定。创建时 api_key 必填，积分倍率由服务端设为 1，初始仅本人可用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserModelInput'
      responses:
        '201':
          description: 创建成功，密钥原文不返回。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserModel'
        '400':
          $ref: '#/components/responses/ResourceError400'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceError404'
        '500':
          $ref: '#/components/responses/ResourceError500'
  /api/v1/models/{modelID}:
    parameters:
    - in: path
      name: modelID
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: 读取自己的模型以供编辑
      description: 系统模型或他人模型均返回 404。已禁用的自有模型仍可读取。
      responses:
        '200':
          description: 模型配置，不包含密钥原文。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserModel'
        '400':
          $ref: '#/components/responses/ResourceError400'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceError404'
        '500':
          $ref: '#/components/responses/ResourceError500'
    put:
      summary: 修改自己的模型
      description: 完整替换可编辑配置。api_key 省略或为空时保留原密钥；已有分享、启用状态和积分倍率保持不变。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserModelInput'
      responses:
        '200':
          description: 修改成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserModel'
        '400':
          $ref: '#/components/responses/ResourceError400'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceError404'
        '500':
          $ref: '#/components/responses/ResourceError500'
    delete:
      summary: 删除自己的模型
      description: 软删除并在同一事务内清除分享授权，后续配置下发和代理调用立即不可用。
      responses:
        '204':
          description: 删除成功，无响应体。
        '400':
          $ref: '#/components/responses/ResourceError400'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceError404'
        '500':
          $ref: '#/components/responses/ResourceError500'
  /api/v1/resources/shares:
    post:
      summary: 批量分享自己的资源给指定用户
      description: 本期仅支持 model。分享为追加的只读使用授权，不覆盖其他接收用户；重复授权不会产生重复记录。每批资源和用户各 1—100 项，任一资源非本人所有或任一接收用户无效时整批回滚。禁止分享给自己，不允许接收方转分享。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareResourcesInput'
      responses:
        '204':
          description: 整批分享成功，无响应体。
        '400':
          $ref: '#/components/responses/ResourceError400'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceError404'
        '500':
          $ref: '#/components/responses/ResourceError500'
    delete:
      summary: 批量撤销指定用户的资源分享
      description: 仅所有者可以撤销。只移除本批指定资源与用户间的授权，不存在的授权视为成功；允许撤销已停用或已删除用户的授权。任一资源无权操作则整批回滚。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareResourcesInput'
      responses:
        '204':
          description: 整批撤销成功，无响应体。
        '400':
          $ref: '#/components/responses/ResourceError400'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceError404'
        '500':
          $ref: '#/components/responses/ResourceError500'
  /api/v1/config:
    get:
      summary: 获取当前 Agent 配置快照
      parameters:
        - in: header
          name: If-None-Match
          description: 上一次响应的 ETag；配置未变化时服务返回 304。
          schema:
            type: string
      responses:
        "200":
          description: 当前用户的完整 Agent 配置快照。
          headers:
            ETag:
              description: 基于配置内容生成的稳定版本标识。
              schema:
                type: string
                examples: ['"sha256:0123456789abcdef"']
            Cache-Control:
              description: 配置快照的缓存策略。
              schema:
                type: string
                examples: ["private, no-cache"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfigSnapshot"
        "304":
          description: 配置未变化，无响应体。
          headers:
            ETag:
              description: 当前配置版本标识。
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/api-keys:
    get:
      summary: 查询当前用户的调用密钥
      responses:
        "200":
          description: 当前用户的调用密钥元数据列表，不包含密钥原文。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeysResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: 创建调用密钥
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyInput"
      responses:
        "201":
          description: 创建成功；api_key 原文只在本次响应中返回。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAPIKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/api-keys/{keyID}:
    parameters:
      - $ref: "#/components/parameters/KeyID"
    delete:
      summary: 撤销调用密钥
      responses:
        "204":
          description: 撤销成功，无响应体。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/api-keys/{keyID}/rotate:
    parameters:
      - $ref: "#/components/parameters/KeyID"
    post:
      summary: 轮换调用密钥
      description: 创建同名、同权限的新密钥并撤销原密钥。
      responses:
        "201":
          description: 轮换成功；api_key 原文只在本次响应中返回。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAPIKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/connectors/{id}/icon:
    get:
      summary: 按用户权限读取连接图标
      responses:
        '200':
          description: 按用户权限读取连接图标
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ResourceError400'
        '401':
          $ref: '#/components/responses/ResourceError401'
        '403':
          $ref: '#/components/responses/ResourceError403'
        '404':
          $ref: '#/components/responses/ResourceError404'
        '409':
          $ref: '#/components/responses/ResourceError409'
        '412':
          $ref: '#/components/responses/ResourceError412'
        '428':
          $ref: '#/components/responses/ResourceError428'
        '500':
          $ref: '#/components/responses/ResourceError500'
        '502':
          $ref: '#/components/responses/ResourceError502'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/experts/{id}/manifest:
    get:
      summary: 读取当前用户可用专家的完整清单
      responses:
        '200':
          description: 读取当前用户可用专家的完整清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpertManifest'
        '400':
          $ref: '#/components/responses/ResourceError400'
        '401':
          $ref: '#/components/responses/ResourceError401'
        '403':
          $ref: '#/components/responses/ResourceError403'
        '404':
          $ref: '#/components/responses/ResourceError404'
        '409':
          $ref: '#/components/responses/ResourceError409'
        '412':
          $ref: '#/components/responses/ResourceError412'
        '428':
          $ref: '#/components/responses/ResourceError428'
        '500':
          $ref: '#/components/responses/ResourceError500'
        '502':
          $ref: '#/components/responses/ResourceError502'
        '304':
          description: ETag 未变化
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/resources/resolve:
    post:
      summary: 解析专家、规则、技能与连接绑定
      responses:
        '200':
          description: 解析专家、规则、技能与连接绑定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpertManifest'
        '400':
          $ref: '#/components/responses/ResourceError400'
        '401':
          $ref: '#/components/responses/ResourceError401'
        '403':
          $ref: '#/components/responses/ResourceError403'
        '404':
          $ref: '#/components/responses/ResourceError404'
        '409':
          $ref: '#/components/responses/ResourceError409'
        '412':
          $ref: '#/components/responses/ResourceError412'
        '428':
          $ref: '#/components/responses/ResourceError428'
        '500':
          $ref: '#/components/responses/ResourceError500'
        '502':
          $ref: '#/components/responses/ResourceError502'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveResources'
  /api/v1/experts/{id}/skills/{skillID}/package:
    get:
      summary: 按专家委托下载技能包
      responses:
        '200':
          description: 按专家委托下载技能包
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ResourceError400'
        '401':
          $ref: '#/components/responses/ResourceError401'
        '403':
          $ref: '#/components/responses/ResourceError403'
        '404':
          $ref: '#/components/responses/ResourceError404'
        '409':
          $ref: '#/components/responses/ResourceError409'
        '412':
          $ref: '#/components/responses/ResourceError412'
        '428':
          $ref: '#/components/responses/ResourceError428'
        '500':
          $ref: '#/components/responses/ResourceError500'
        '502':
          $ref: '#/components/responses/ResourceError502'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: skillID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sha256
        in: query
        schema:
          type: string
        description: 客户端清单记录的包摘要；与当前包不同返回 412。
  /api/v1/connectors/{id}/credential:
    put:
      summary: 配置或撤销当前合法认证上下文
      responses:
        '204':
          description: 配置或撤销当前合法认证上下文
        '400':
          $ref: '#/components/responses/ResourceError400'
        '401':
          $ref: '#/components/responses/ResourceError401'
        '403':
          $ref: '#/components/responses/ResourceError403'
        '404':
          $ref: '#/components/responses/ResourceError404'
        '409':
          $ref: '#/components/responses/ResourceError409'
        '412':
          $ref: '#/components/responses/ResourceError412'
        '428':
          $ref: '#/components/responses/ResourceError428'
        '500':
          $ref: '#/components/responses/ResourceError500'
        '502':
          $ref: '#/components/responses/ResourceError502'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialInput'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: 配置或撤销当前合法认证上下文
      responses:
        '204':
          description: 配置或撤销当前合法认证上下文
        '400':
          $ref: '#/components/responses/ResourceError400'
        '401':
          $ref: '#/components/responses/ResourceError401'
        '403':
          $ref: '#/components/responses/ResourceError403'
        '404':
          $ref: '#/components/responses/ResourceError404'
        '409':
          $ref: '#/components/responses/ResourceError409'
        '412':
          $ref: '#/components/responses/ResourceError412'
        '428':
          $ref: '#/components/responses/ResourceError428'
        '500':
          $ref: '#/components/responses/ResourceError500'
        '502':
          $ref: '#/components/responses/ResourceError502'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/connectors/{id}/test:
    post:
      summary: 执行真实 MCP 握手与全量工具发现
      responses:
        '200':
          description: 执行真实 MCP 握手与全量工具发现
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection_status:
                    type: string
                  tool_count:
                    type: integer
        '400':
          $ref: '#/components/responses/ResourceError400'
        '401':
          $ref: '#/components/responses/ResourceError401'
        '403':
          $ref: '#/components/responses/ResourceError403'
        '404':
          $ref: '#/components/responses/ResourceError404'
        '409':
          $ref: '#/components/responses/ResourceError409'
        '412':
          $ref: '#/components/responses/ResourceError412'
        '428':
          $ref: '#/components/responses/ResourceError428'
        '500':
          $ref: '#/components/responses/ResourceError500'
        '502':
          $ref: '#/components/responses/ResourceError502'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/connectors/{id}/tools:
    get:
      summary: 读取认证上下文的工具目录
      responses:
        '200':
          description: 读取认证上下文的工具目录
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MCPTool'
        '400':
          $ref: '#/components/responses/ResourceError400'
        '401':
          $ref: '#/components/responses/ResourceError401'
        '403':
          $ref: '#/components/responses/ResourceError403'
        '404':
          $ref: '#/components/responses/ResourceError404'
        '409':
          $ref: '#/components/responses/ResourceError409'
        '412':
          $ref: '#/components/responses/ResourceError412'
        '428':
          $ref: '#/components/responses/ResourceError428'
        '500':
          $ref: '#/components/responses/ResourceError500'
        '502':
          $ref: '#/components/responses/ResourceError502'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/connectors/{id}/oauth/authorizations:
    post:
      summary: 生成 OAuth state 与 PKCE 授权事务
      responses:
        '200':
          description: 生成 OAuth state 与 PKCE 授权事务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAuthorization'
        '400':
          $ref: '#/components/responses/ResourceError400'
        '401':
          $ref: '#/components/responses/ResourceError401'
        '403':
          $ref: '#/components/responses/ResourceError403'
        '404':
          $ref: '#/components/responses/ResourceError404'
        '409':
          $ref: '#/components/responses/ResourceError409'
        '412':
          $ref: '#/components/responses/ResourceError412'
        '428':
          $ref: '#/components/responses/ResourceError428'
        '500':
          $ref: '#/components/responses/ResourceError500'
        '502':
          $ref: '#/components/responses/ResourceError502'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/connector-authorizations/{id}:
    get:
      summary: 查询本人发起的授权事务状态
      responses:
        '200':
          description: 查询本人发起的授权事务状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationStatus'
        '400':
          $ref: '#/components/responses/ResourceError400'
        '401':
          $ref: '#/components/responses/ResourceError401'
        '403':
          $ref: '#/components/responses/ResourceError403'
        '404':
          $ref: '#/components/responses/ResourceError404'
        '409':
          $ref: '#/components/responses/ResourceError409'
        '412':
          $ref: '#/components/responses/ResourceError412'
        '428':
          $ref: '#/components/responses/ResourceError428'
        '500':
          $ref: '#/components/responses/ResourceError500'
        '502':
          $ref: '#/components/responses/ResourceError502'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/skills/{id}/package:
    get:
      summary: 按当前权限下载技能包
      responses:
        '200':
          description: 按当前权限下载技能包
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ResourceError400'
        '401':
          $ref: '#/components/responses/ResourceError401'
        '403':
          $ref: '#/components/responses/ResourceError403'
        '404':
          $ref: '#/components/responses/ResourceError404'
        '409':
          $ref: '#/components/responses/ResourceError409'
        '412':
          $ref: '#/components/responses/ResourceError412'
        '428':
          $ref: '#/components/responses/ResourceError428'
        '500':
          $ref: '#/components/responses/ResourceError500'
        '502':
          $ref: '#/components/responses/ResourceError502'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sha256
        in: query
        schema:
          type: string
        description: 客户端清单记录的包摘要；与当前包不同返回 412。
components:
  securitySchemes:
    InvocationKey:
      type: http
      scheme: bearer
      description: 含 mcp:invoke 的长期调用密钥。
    OAuthAccessToken:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
      description: Agent 登录授权流程签发的短期 access token。
  parameters:
    KeyID:
      in: path
      name: keyID
      required: true
      description: 调用密钥 UUID。
      schema:
        type: string
        format: uuid
  responses:
    ResourceError400:
      description: 字段或关联无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError401:
      description: 需要登录
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError403:
      description: 无权操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError404:
      description: 资源不存在或无权访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError409:
      description: 名称或引用冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError412:
      description: 修订或技能包摘要已变化
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError428:
      description: 缺少 If-Match
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError500:
      description: 读取或保存失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError502:
      description: 上游连接失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    BadRequest:
      description: 请求参数或请求体无效。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 缺少 access token，或 token 无效、已过期。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 指定资源不存在或不属于当前用户。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: 服务内部错误。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CreditAmount:
      type: string
      pattern: ^-?\d+(\.\d{1,6})?$
      description: 十进制定点积分，最多六位小数。
    CreditAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        period_start_at:
          type: string
          format: date-time
        period_end_at:
          type: string
          format: date-time
        balance:
          $ref: '#/components/schemas/CreditAmount'
        frozen:
          $ref: '#/components/schemas/CreditAmount'
        available:
          $ref: '#/components/schemas/CreditAmount'
        quota:
          $ref: '#/components/schemas/CreditAmount'
      required:
      - id
      - user_id
      - balance
      - frozen
      - available
      - quota
      - period_start_at
      - period_end_at
    UserSummary:
      type: object
      required:
      - id
      - name
      - email
      properties:
        id: &id006
          type: string
          format: uuid
        name:
          type: string
          description: 用户名。
        email:
          type: string
          format: email
    SearchUsersResponse:
      type: object
      required:
      - users
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
    AgentModelsResponse:
      type: object
      required:
      - models
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/AgentModel'
    UserModelInput:
      type: object
      required:
      - model_id
      - display_name
      - protocol
      - base_url
      - advanced_config
      properties:
        model_id: &id001
          type: string
          description: 上游模型名称，非代理调用时的内部模型 ID。
        display_name: &id002
          type: string
          description: 展示名称。
        protocol: &id003
          type: string
          enum:
          - openai_chat_completions
          - openai_responses
          - anthropic
        base_url: &id004
          type: string
          format: uri
          description: 上游 HTTP(S) 地址，不允许包含用户名密码。
        api_key:
          type: string
          writeOnly: true
          description: 上游密钥，仅写入；更新时省略或为空表示保留。
        advanced_config: &id005
          type: object
          required:
          - context_window_tokens
          - max_output_tokens
          - supports_vision
          properties:
            context_window_tokens:
              type: integer
              format: int64
              minimum: 1
            max_output_tokens:
              type: integer
              format: int64
              minimum: 1
            supports_vision:
              type: boolean
    CreateUserModelInput:
      allOf:
      - $ref: '#/components/schemas/UserModelInput'
      - type: object
        required:
        - api_key
        properties:
          api_key:
            type: string
            minLength: 1
            writeOnly: true
    UserModel:
      type: object
      required:
      - id
      - ownership_type
      - owner_user_id
      - model_id
      - display_name
      - protocol
      - base_url
      - api_key_configured
      - advanced_config
      - credit_multiplier
      - authorization
      - enabled
      - created_at
      - updated_at
      properties:
        model_id: *id001
        display_name: *id002
        protocol: *id003
        base_url: *id004
        advanced_config: *id005
        id: *id006
        ownership_type:
          type: string
          const: user
        owner_user_id: *id006
        api_key_configured:
          type: boolean
        credit_multiplier:
          type: number
          exclusiveMinimum: 0
          description: 服务端管理，用户不可修改。
        authorization:
          type: object
          required:
          - user_ids
          - group_ids
          properties:
            user_ids:
              type: array
              items: *id006
            group_ids:
              type: array
              items: *id006
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ShareResourcesInput:
      type: object
      required:
      - resources
      - user_ids
      properties:
        resources:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required:
            - type
            - id
            properties:
              type:
                type: string
                enum:
                - model
                description: 资源类型。将来可扩展 skill、connector、rule；本期其他类型返回 400。
              id: *id006
        user_ids:
          type: array
          minItems: 1
          maxItems: 100
          items: *id006
          description: 接收用户 ID，重复项自动去重。
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 供调用方识别错误类别的稳定代码。
          examples: [api_key_error]
        message:
          type: string
          description: 面向用户或开发者的错误说明。
    AgentConfigSnapshot:
      type: object
      required: [version, updated_at, settings, model_gateway, models, schema_version, rules, skills, experts, connectors]
      properties:
        schema_version:
          type: integer
          const: 2
        rules:
          type: array
          items:
            $ref: '#/components/schemas/AgentRule'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/AgentSkill'
        experts:
          type: array
          items:
            $ref: '#/components/schemas/AgentExpert'
        connectors:
          type: array
          items:
            $ref: '#/components/schemas/AgentConnector'
        version:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: 对配置快照内容计算得到的稳定 SHA-256 版本。
        updated_at:
          type: string
          format: date-time
          description: 设置或可用模型最近一次发生变化的时间。
        settings:
          $ref: "#/components/schemas/AgentSettings"
        model_gateway:
          $ref: "#/components/schemas/ModelGateway"
        models:
          type: array
          description: 当前用户有权调用且处于启用状态的模型。
          items:
            $ref: "#/components/schemas/AgentModel"
    AgentSettings:
      type: object
      description: 按设置域组织的全局设置快照；只返回已配置的设置域，服务端密钥字段已移除。
      properties:
        branding:
          $ref: "#/components/schemas/BrandingSettings"
        authentication:
          $ref: "#/components/schemas/AuthenticationSettings"
        email:
          $ref: "#/components/schemas/EmailSettings"
        billing:
          $ref: "#/components/schemas/BillingSettings"
      additionalProperties:
        type: object
        description: 后续新增设置域的配置对象。
    BrandingSettings:
      type: object
      required: [workspace_name, product_name]
      properties:
        workspace_name:
          type: string
          description: 工作区名称。
        product_name:
          type: string
          description: Agent 向用户展示的产品名称。
      additionalProperties: true
    AuthenticationSettings:
      type: object
      properties:
        registration_enabled:
          type: boolean
          description: 是否允许新用户注册。
        password_enabled:
          type: boolean
          description: 是否允许密码登录。
        email_code_enabled:
          type: boolean
          description: 是否允许邮箱验证码登录。
        oauth_connections:
          type: array
          description: 已配置的 OAuth 登录连接；不包含 client_secret。
          items:
            $ref: "#/components/schemas/OAuthConnection"
      additionalProperties: true
    OAuthConnection:
      type: object
      required: [id, provider, name, client_id, enabled]
      properties:
        id:
          type: string
          description: OAuth 连接的稳定标识。
        provider:
          type: string
          enum: [github, google, microsoft, gitlab, oidc]
          description: OAuth 或 OIDC 提供方。
        name:
          type: string
          description: 登录界面展示的连接名称。
        client_id:
          type: string
          description: OAuth Client ID。
        issuer_url:
          type: string
          format: uri
          description: OIDC Issuer URL；非 OIDC 连接可不返回。
        authorization_url:
          type: string
          format: uri
          description: 自定义授权端点；使用提供方默认端点时可不返回。
        token_url:
          type: string
          format: uri
          description: 自定义 Token 端点；使用提供方默认端点时可不返回。
        userinfo_url:
          type: string
          format: uri
          description: 自定义用户信息端点；使用提供方默认端点时可不返回。
        scopes:
          type: array
          description: 请求上游授权时使用的 Scope；使用默认 Scope 时可不返回。
          items:
            type: string
        enabled:
          type: boolean
          description: 此登录连接是否启用。
      additionalProperties: true
    EmailSettings:
      type: object
      properties:
        sender_name:
          type: string
          description: 邮件发件人名称。
        sender_email:
          type: string
          format: email
          description: 邮件发件人地址。
        smtp_host:
          type: string
          description: SMTP 服务器主机名。
        smtp_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: SMTP 服务器端口。
        smtp_username:
          type: string
          description: SMTP 登录用户名。
        smtp_encryption:
          type: string
          enum: [none, starttls, tls]
          description: SMTP 连接加密方式。
      additionalProperties: true
    BillingSettings:
      type: object
      properties:
        input_credits_per_million_tokens:
          type: number
          minimum: 0
          description: 每百万输入 Token 消耗的积分。
        cached_input_credits_per_million_tokens:
          type: number
          minimum: 0
          description: 每百万缓存输入 Token 消耗的积分。
        output_credits_per_million_tokens:
          type: number
          minimum: 0
          description: 每百万输出 Token 消耗的积分。
        quota_refresh_cycle:
          type: string
          enum: [daily, weekly, monthly]
          description: 积分额度刷新周期。
        charging_mode:
          type: string
          enum: [local, remote]
          description: 使用本地积分账户或远程计费服务。
        remote_billing_base_url:
          type: [string, "null"]
          format: uri
          description: 远程计费服务地址；本地计费时可为空。
        root_credits:
          type: number
          minimum: 0
          description: 默认根额度积分数。
        quota_overrides:
          type: object
          description: 按用户或分组标识覆盖的积分额度。
          additionalProperties:
            type: string
      additionalProperties: true
    ModelGateway:
      type: object
      required: [base_url, authentication]
      properties:
        base_url:
          type: string
          format: uri
          description: 兼容模型 SDK 的代理 Base URL。
        authentication:
          type: string
          enum: [api_key]
          description: 模型代理使用用户创建的调用密钥鉴权。
    AgentModel:
      type: object
      required:
        - ownership_type
        - owner_user_id
        - id
        - model
        - display_name
        - protocol
        - context_window_tokens
        - max_output_tokens
        - supports_vision
        - credit_multiplier
      properties:
        ownership_type:
          type: string
          enum:
          - system
          - user
          description: 资源归属，固定为 system 或 user；分享不会改变此值。自有和他人分享的个人模型均为 user，通过 owner_user_id 区分。
        owner_user_id:
          type: string
          format: uuid
          description: 创建者用户 ID。
        creator:
          $ref: '#/components/schemas/UserSummary'
          description: 他人创建的用户模型返回创建者；自己的模型和系统模型不返回。
        shared_users:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
          description: 仅自己的用户模型返回分享用户列表，未分享时为空数组，排除已删除用户。接收方和系统模型不返回此字段。
        id:
          type: string
          format: uuid
          description: MonkeyAI 内部模型 ID。
        model:
          type: string
          format: uuid
          description: 调用模型代理时传入的 model 值，当前与 id 相同。
        display_name:
          type: string
          description: Agent 向用户展示的模型名称。
        protocol:
          type: string
          enum: [openai_chat_completions, openai_responses, anthropic]
          description: MonkeyAI 与上游服务通信时使用的协议。
        context_window_tokens:
          type: integer
          format: int64
          minimum: 1
          description: 模型上下文窗口的最大 Token 数。
        max_output_tokens:
          type: integer
          format: int64
          minimum: 1
          description: 单次请求允许生成的最大 Token 数。
        supports_vision:
          type: boolean
          description: 模型是否支持图像输入。
        credit_multiplier:
          type: number
          exclusiveMinimum: 0
          description: 本模型消耗积分时使用的倍率。
    APIKeysResponse:
      type: object
      required: [api_keys]
      properties:
        api_keys:
          type: array
          description: 当前用户的调用密钥元数据，不包含可用于鉴权的密钥原文。
          items:
            $ref: "#/components/schemas/APIKey"
    CreateAPIKeyInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: 便于用户识别密钥用途的名称。
        scopes:
          type: array
          description: 调用权限；不传或传空数组时默认为 model:invoke。
          default: ["model:invoke"]
          uniqueItems: true
          items:
            type: string
            enum: ["model:invoke", "mcp:invoke"]
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
          description: 密钥自创建时起的有效天数。
    APIKey:
      type: object
      required:
        - id
        - user_id
        - name
        - key_prefix
        - scopes
        - expires_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: 调用密钥 ID。
        user_id:
          type: string
          format: uuid
          description: 密钥所属用户 ID。
        user_name:
          type: string
          description: 密钥所属用户的显示名称。
        name:
          type: string
          description: 用户设置的密钥名称。
        key_prefix:
          type: string
          description: 用于识别密钥的安全前缀，不可用于鉴权。
          examples: [mk_abcd1234]
        scopes:
          type: array
          description: 密钥具备的调用权限。
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: ["model:invoke", "mcp:invoke"]
        expires_at:
          type: string
          format: date-time
          description: 密钥过期时间。
        last_used_at:
          type: string
          format: date-time
          description: 最近一次成功使用时间；从未使用时不返回。
        created_at:
          type: string
          format: date-time
          description: 密钥创建时间。
        revoked_at:
          type: string
          format: date-time
          description: 密钥撤销时间；尚未撤销时不返回。
    CreatedAPIKey:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [api_key]
          properties:
            api_key:
              type: string
              pattern: "^mk_"
              description: 可用于模型或 MCP 请求鉴权的密钥原文，只返回一次。

    ResourceGrant:
      type: object
      properties:
        user_id:
          type:
          - string
          - 'null'
          format: uuid
        group_id:
          type:
          - string
          - 'null'
          format: uuid
        usage_requirement:
          type: string
          enum:
          - optional
          - required
          description: 仅系统规则可设置 required。
      required:
      - usage_requirement
    ResourceError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            references:
              type:
              - array
              - 'null'
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
          required:
          - code
          - message
      required:
      - error
    ResourceTag:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    ProviderDependency:
      type: object
      properties:
        provider_id:
          type: string
          format: uuid
        required:
          type: boolean
        tool_allowlist:
          type: array
          items:
            type: string
        tool_denylist:
          type: array
          items:
            type: string
      required:
      - provider_id
    OAuthConnectionConfig:
      type: object
      properties:
        authorization_url:
          type: string
        token_url:
          type: string
        client_id:
          type: string
        scopes:
          type: string
    ResourceIssue:
      type: object
      properties:
        code:
          type: string
        provider_id:
          type: string
          format: uuid
        blocking:
          type: boolean
      required:
      - code
      - blocking
    MCPTool:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        input_schema:
          type: object
        enabled:
          type: boolean
        credits_per_call:
          type: number
          minimum: 0
      required:
      - id
      - name
      - description
      - input_schema
      - enabled
      - credits_per_call
    AgentRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        content:
          type: string
        sha256:
          type: string
        required:
          type: boolean
      required:
      - id
      - name
      - content
      - sha256
      - required
    AgentSkill:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        package_sha256:
          type: string
        package_size_bytes:
          type: integer
        file_count:
          type: integer
        download_path:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/ResourceTag'
      required:
      - id
      - name
      - description
      - package_sha256
      - download_path
    AgentConnector:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        provider_identifier:
          type: string
        icon_path:
          type: string
        name:
          type: string
        authorization_mode:
          type: string
          enum:
          - none
          - centralized
          - independent
        authorization_method:
          type:
          - string
          - 'null'
        authorization_status:
          type: string
          enum:
          - not_required
          - authorized
          - authorization_required
        connection_status:
          type: string
        capabilities:
          type: array
          items:
            type: string
            enum:
            - catalog
        tools:
          type: array
          items:
            $ref: '#/components/schemas/MCPTool'
        tools_version:
          type: string
        tools_path:
          type: string
      required:
      - id
      - provider_id
      - name
