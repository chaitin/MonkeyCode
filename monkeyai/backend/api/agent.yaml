  /mcp/connectors/{id}/credentials/{credential_id}:
    parameters:
    - in: path
      name: id
      schema:
        type: string
        format: uuid
      required: true
    - in: header
      name: MCP-Protocol-Version
      description: 后续请求应携带握手协商的版本；未知版本返回 400。
      schema:
        type: string
        enum:
        - '2024-11-05'
        - '2025-03-26'
        - '2025-06-18'
        - '2025-11-25'
    - name: credential_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      summary: 调用指定凭证的 MCP 网关
      description: 使用全局 mcp:invoke API Key 认证用户；地址明确指定集中或独立凭证。每次请求校验用户的连接使用权、凭证与连接关系及当前状态，独立凭证必须属于调用用户。撤销的凭证地址不自动切换到新凭证。 tools/list
        和 tools/call 使用上游原始工具名称，并执行实时工具启停检查。
      security:
      - InvocationKey: []
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          maxLength: 128
      - in: header
        name: X-Session-ID
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  const: '2.0'
                id:
                  type:
                  - string
                  - number
                  description: 请求必须携带，通知省略；原值随响应返回。
                method:
                  type: string
                  examples:
                  - initialize
                  - notifications/initialized
                  - ping
                  - tools/list
                  - tools/call
                params:
                  type: object
                  description: tools/call 使用精确工具名称 name 和对象 arguments，保留 _meta 等扩展字段；tools/list 返回完整目录，不接受非空 cursor。
              required:
              - jsonrpc
              - method
      responses:
        '200':
          description: JSON-RPC 结果或协议错误
          headers:
            X-Billing-Transaction-ID:
              schema:
                type: string
                format: uuid
            X-Billing-Status:
              schema:
                type: string
                enum:
                - pending
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    const: '2.0'
                  id:
                    type:
                    - string
                    - number
                    - 'null'
                  result: {}
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
                      data: {}
                    required:
                    - code
                    - message
                required:
                - jsonrpc
                - id
        '202':
          description: 已接收通知，响应体为空
        '400':
          description: 请求格式、参数或协议版本不合法
        '401':
          description: 调用密钥缺失、失效或没有 mcp:invoke 作用域
        '402':
          description: 积分不足
        '403':
          description: 请求来源、用户、会话或连接认证不允许调用
        '404':
          description: 连接不存在、已禁用或未获授权
        '409':
          description: 幂等键或交易状态冲突，不重复执行工具
          headers:
            X-Billing-Transaction-ID:
              schema:
                type: string
                format: uuid
        '413':
          description: 请求体超过 1 MiB
        '415':
          description: 请求类型必须为 application/json
        '502':
          description: 上游连接或握手失败
    get:
      summary: 此无状态入口不提供 SSE 订阅
      security:
      - InvocationKey: []
      responses:
        '405':
          description: 不支持此方法，Allow 为 POST
        '401':
          description: 调用密钥无效
        '403':
          description: 请求来源不允许
    delete:
      summary: 此无状态入口不维护下游 MCP 会话
      security:
      - InvocationKey: []
      responses:
        '405':
          description: 不支持此方法，Allow 为 POST
        '401':
          description: 调用密钥无效
        '403':
          description: 请求来源不允许
  /api/v1/groups:
    get:
      summary: 列出或搜索可分享的分组
      description: 未提供 q 时返回全部未删除分组及虚拟根组；提供非空 q 时按名称不区分大小写进行字面子串匹配，返回未删除分组及名称匹配的虚拟根组，不包含成员信息。根组名称来自 branding.workspace_name，搜索时优先返回且计入 limit。分享给父组可覆盖后代组成员；分享给根组覆盖系统全体用户，包括后续新增用户。
      parameters:
      - in: query
        name: q
        schema: {type: string}
        description: 可选的分组名称搜索关键词；省略或去除首尾空白后为空时返回全部分组。
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        description: 搜索时返回的最多分组数。
      responses:
        '200':
          description: 分组列表。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchGroupsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/users:
    get:
      summary: 按用户名或邮箱查找分享接收用户
      description: 不区分大小写的字面子串匹配，仅返回有效用户，排除当前用户。用户名对应用户的 name 字段。按名称和 ID 排序，最多返回 limit 项；结果过多时请细化关键词。
      parameters:
      - in: query
        name: q
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
        description: 去除首尾空白后长度为 1—200 字节。
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
