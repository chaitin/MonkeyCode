  /api/auth/v1/branding:
    get:
      summary: 读取公开品牌信息
      description: 返回登录页展示所需的团队名称和工具名称；未配置或配置不可用时返回默认值，不包含其他设置。
      security: []
      responses:
        "200":
          description: 公开品牌信息
          content:
            application/json:
              schema:
                type: object
                required:
                  - workspace_name
                  - product_name
                properties:
                  workspace_name:
