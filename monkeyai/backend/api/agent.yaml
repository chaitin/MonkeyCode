openapi: 3.1.0
info:
  title: MonkeyAI Agent API
  version: 1.0.0
security:
  - OAuthAccessToken: []
paths:
  /oauth/connectors/{id}/callback:
    get:
      summary: 处理指定 MCP 的 OAuth 回调
      description: 校验 MCP id 与 state 绑定、有效期及配置版本，单次消费授权事务并在服务端交换和保存 Token。无需浏览器会话或 Agent Token。
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: state
        in: query
        required: true
        schema:
          type: string
      - name: code
        in: query
        description: 授权成功时返回的授权码。
        schema:
          type: string
      - name: error
        in: query
        description: 授权拒绝或取消时返回的错误码。
        schema:
          type: string
      responses:
        '200':
          description: 凭证已保存，浏览器显示授权成功页面。
          content:
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ResourceError400'
        '409':
          $ref: '#/components/responses/ResourceError409'
        '500':
          $ref: '#/components/responses/ResourceError500'
        '502':
          $ref: '#/components/responses/ResourceError502'
  /api/auth/v1/methods:
    get:
      summary: 读取公开登录方式开关
      security: []
      responses:
        "200":
          description: 仅包含登录开关，不包含 SMTP 或 OAuth 密钥
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailLoginMethods"
        "503":
          description: 认证配置不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
  /api/auth/v1/email/code:
    post:
      summary: 发送邮箱验证码
      description: login 受 email_code_enabled 控制；register 需要开放注册并至少启用一种邮箱登录方式；reset 受
        password_enabled 控制。每邮箱每分钟最多 1 次、每小时最多 10 次，每连接来源 IP 每小时最多 30
        次；失败发送也计入限额。不存在或不符合用途的账号返回相同成功响应但不发送邮件。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - purpose
              properties:
                email: &a1
                  type: string
                  format: email
                  maxLength: 254
                  description: 邮箱会去除首尾空白并转为小写。
                purpose:
                  type: string
                  enum:
                    - login
                    - register
                    - reset
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - retry_after
                properties:
                  message:
                    type: string
                  retry_after:
                    type: integer
                    const: 60
        "400":
          description: 请求无效，或验证码无效、过期、超过错误次数限制
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "401":
          description: 邮箱密码不匹配或账号不符合登录入口角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "403":
          description: 对应登录方式或注册开关关闭
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "409":
          description: 邮箱已存在，注册冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "429":
          description: 验证码发送过于频繁
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
          headers:
            Retry-After:
              schema:
                type: integer
                const: 60
        "500":
          description: 认证操作失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "502":
          description: 邮件发送失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "503":
          description: 认证配置或邮件服务不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
  /api/auth/v1/email/reset-password:
    post:
      summary: 通过邮箱验证码重置密码
      description: 使用 reset 用途验证码，需要开启密码登录。重置后撤销全部旧浏览器会话、OAuth token
        和未使用授权码，并使现有登录验证码失效。不会自动登录。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
                - password
              properties:
                email: *a1
                code: &a2
                  type: string
                  pattern: ^[0-9]{6}$
                  description: 十分钟内有效的六位数字验证码，仅可使用一次。
                password: &a3
                  type: string
                  minLength: 12
                  maxLength: 1024
                  writeOnly: true
                  description: 新密码至少 12 个字符，长度按 UTF-8 字节校验。
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - reset
                properties:
                  reset:
                    type: boolean
                    const: true
        "400":
          description: 请求无效，或验证码无效、过期、超过错误次数限制
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "401":
          description: 邮箱密码不匹配或账号不符合登录入口角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "403":
          description: 对应登录方式或注册开关关闭
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "409":
          description: 邮箱已存在，注册冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "429":
          description: 验证码发送过于频繁
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
          headers:
            Retry-After:
              schema:
                type: integer
                const: 60
        "500":
          description: 认证操作失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "502":
          description: 邮件发送失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "503":
          description: 认证配置或邮件服务不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
  /api/auth/v1/login:
    post:
      summary: 使用密码登录客户端
      description: 需要开启 password_enabled，允许启用状态的普通用户和管理员；成功设置 HttpOnly、SameSite=Lax 会话
        Cookie，HTTPS 环境附加 Secure。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email: *a1
                password:
                  type: string
                  maxLength: 1024
                  writeOnly: true
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthUser"
          headers:
            Set-Cookie:
              schema:
                type: string
              description: monkeyai_session 会话 Cookie，默认有效期 7 天。
        "400":
          description: 请求无效，或验证码无效、过期、超过错误次数限制
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "401":
          description: 邮箱密码不匹配或账号不符合登录入口角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "403":
          description: 对应登录方式或注册开关关闭
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "409":
          description: 邮箱已存在，注册冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "429":
          description: 验证码发送过于频繁
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
          headers:
            Retry-After:
              schema:
                type: integer
                const: 60
        "500":
          description: 认证操作失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "502":
          description: 邮件发送失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "503":
          description: 认证配置或邮件服务不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
  /api/auth/v1/email/login:
    post:
      summary: 使用邮箱验证码登录客户端
      description: 需要开启 email_code_enabled，使用 login
        用途验证码。允许启用状态的普通用户和管理员，成功建立浏览器会话；验证码最多允许 5 次错误尝试。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
              properties:
                email: *a1
                code: *a2
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthUser"
          headers:
            Set-Cookie:
              schema:
                type: string
              description: monkeyai_session 会话 Cookie，默认有效期 7 天。
        "400":
          description: 请求无效，或验证码无效、过期、超过错误次数限制
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "401":
          description: 邮箱密码不匹配或账号不符合登录入口角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "403":
          description: 对应登录方式或注册开关关闭
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "409":
          description: 邮箱已存在，注册冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "429":
          description: 验证码发送过于频繁
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
          headers:
            Retry-After:
              schema:
                type: integer
                const: 60
        "500":
          description: 认证操作失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "502":
          description: 邮件发送失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "503":
          description: 认证配置或邮件服务不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
  /api/auth/v1/email/register:
    post:
      summary: 自助邮箱注册
      description: 需要开放注册且至少启用一种邮箱登录方式，使用 register
        用途验证码。仅创建普通用户，不覆盖已有账号；成功建立浏览器会话，可继续客户端 PKCE 授权。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
                - name
                - password
              properties:
                email: *a1
                code: *a2
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                password: *a3
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthUser"
          headers:
            Set-Cookie:
              schema:
                type: string
              description: monkeyai_session 会话 Cookie，默认有效期 7 天。
        "400":
          description: 请求无效，或验证码无效、过期、超过错误次数限制
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "401":
          description: 邮箱密码不匹配或账号不符合登录入口角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "403":
          description: 对应登录方式或注册开关关闭
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "409":
          description: 邮箱已存在，注册冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "429":
          description: 验证码发送过于频繁
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
          headers:
            Retry-After:
              schema:
                type: integer
                const: 60
        "500":
          description: 认证操作失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "502":
          description: 邮件发送失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "503":
          description: 认证配置或邮件服务不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
  /api/v1/billing/account:
    get:
      summary: 查询当前用户周期余额和冻结额
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditAccount'
        '400':
          description: 参数不合法
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 修订号、幂等键或交易状态冲突
  /mcp/connectors/{id}:
    parameters:
    - in: path
      name: id
      schema:
        type: string
        format: uuid
      required: true
    - in: header
      name: MCP-Protocol-Version
      description: 后续请求应携带握手协商的版本；未知版本返回 400。
      schema:
        type: string
        enum: ['2024-11-05', '2025-03-26', '2025-06-18', '2025-11-25']
    post:
      summary: MCP 工具代理：集中认证成功调用计费
      description: >-
        无状态 Streamable HTTP 入口，返回 JSON，支持上游 JSON 和 SSE 响应。
        Bearer 长期调用密钥必须包含 mcp:invoke；OAuth access token 不可代替调用密钥。
        initialize 协商协议版本，不支持的版本返回服务端支持的 2025-11-25。
        工具目录仅包含当前用户可用且启用的工具；调用前刷新 OAuth 凭证。
        通知返回空的 202，无 ID 的消息不会执行工具。请求不支持批量 JSON-RPC。
        不创建下游 MCP 会话，不提供服务端推送、resources、prompts 或双向交互。
        每次工具调用独立建立并清理上游会话，原始参数与有效工具结果保真传递。
        非空 Origin 必须与服务公开地址同源。客户端应接受 application/json 和 text/event-stream。
        X-Billing-Transaction-ID 用于查询；X-Billing-Status 为 pending 时结算等待恢复。
        集中认证工具成功收费，独立认证、免认证、JSON-RPC 错误及 isError=true 不收费。
        超时、断流和无效结果转入核查，不重放上游；重复幂等键返回 409 和原交易 ID。
        业务错误使用 JSON-RPC error，data.code 保留业务错误码，data.references 保留交易引用。
      security:
      - InvocationKey: []
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          maxLength: 128
      - in: header
        name: X-Session-ID
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  const: '2.0'
                id:
                  type: [string, number]
                  description: 请求必须携带，通知省略；原值随响应返回。
                method:
                  type: string
                  examples: [initialize, notifications/initialized, ping, tools/list, tools/call]
                params:
                  type: object
                  description: tools/call 使用精确工具名称 name 和对象 arguments，保留 _meta 等扩展字段；tools/list 返回完整目录，不接受非空 cursor。
              required: [jsonrpc, method]
      responses:
        '200':
          description: JSON-RPC 结果或协议错误
          headers:
            X-Billing-Transaction-ID:
              schema:
                type: string
                format: uuid
            X-Billing-Status:
              schema:
                type: string
                enum: [pending]
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    const: '2.0'
                  id:
                    type: [string, number, 'null']
                  result: {}
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
                      data: {}
                    required: [code, message]
                required: [jsonrpc, id]
        '202':
          description: 已接收通知，响应体为空
        '400':
          description: 请求格式、参数或协议版本不合法
        '401':
          description: 调用密钥缺失、失效或没有 mcp:invoke 作用域
        '402':
          description: 积分不足
        '403':
          description: 请求来源、用户、会话或连接认证不允许调用
        '404':
          description: 连接不存在、已禁用或未获授权
        '409':
          description: 幂等键或交易状态冲突，不重复执行工具
          headers:
            X-Billing-Transaction-ID:
              schema:
                type: string
                format: uuid
        '413':
          description: 请求体超过 1 MiB
        '415':
          description: 请求类型必须为 application/json
        '502':
          description: 上游连接或握手失败
    get:
      summary: 此无状态入口不提供 SSE 订阅
      security:
      - InvocationKey: []
      responses:
        '405':
          description: 不支持此方法，Allow 为 POST
        '401':
          description: 调用密钥无效
        '403':
          description: 请求来源不允许
    delete:
      summary: 此无状态入口不维护下游 MCP 会话
      security:
      - InvocationKey: []
      responses:
        '405':
          description: 不支持此方法，Allow 为 POST
        '401':
          description: 调用密钥无效
        '403':
          description: 请求来源不允许
  /api/v1/users:
    get:
      summary: 按用户名或邮箱查找分享接收用户
      description: 不区分大小写的字面子串匹配，仅返回有效用户，排除当前用户。用户名对应用户的 name 字段。按名称和 ID 排序，最多返回 limit 项；结果过多时请细化关键词。
      parameters:
      - in: query
        name: q
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
        description: 去除首尾空白后长度为 1—200 字节。
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: 匹配的用户简要信息。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchUsersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/models:
    get:
      summary: 读取 Agent 模型目录
      description: 仅包含启用的系统授权模型、自有模型和收到分享的模型，同时返回模型代理地址与鉴权方式。版本只覆盖模型目录和代理信息。
      parameters:
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 模型目录数据，不包含服务端密钥。
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModelsResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: 创建当前用户的个人模型
      description: 所有者由登录身份确定。创建时 api_key 必填，积分倍率由服务端设为 1，初始仅本人可用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserModelInput'
      responses:
        '201':
          description: 创建成功，密钥原文不返回。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserModel'
        '400':
          $ref: '#/components/responses/ResourceError400'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
