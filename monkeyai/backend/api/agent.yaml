  /api/v1/resources/shares:
    post:
      summary: 批量分享自己的资源给指定用户或分组
      description: 支持 model、rule、skill、connector、expert；个人规则共享后接收者可选择使用，但不能强制应用。个人 Connector 的接收方使用自己的独立凭证，个人专家的依赖仍需接收方获得使用授权。分享为追加的只读使用授权，不覆盖其他授权；重复授权不会产生重复记录。每批资源 1—100 项，用户与分组 ID 合计 1—100 项；任一资源非本人所有、任一接收用户无效或分组不存在时整批回滚。禁止直接分享给自己，不允许接收方转分享。组授权覆盖其后代组成员并随成员关系变化即时生效；全零 UUID 根组表示系统全员授权，包括后续新增用户。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareResourcesInput'
      responses:
        '204':
          description: 整批分享成功，无响应体。
        '400':
          $ref: '#/components/responses/ResourceError400'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceError404'
        '500':
          $ref: '#/components/responses/ResourceError500'
    delete:
      summary: 批量撤销指定用户或分组的资源分享
      description: 仅所有者可以撤销。只移除本批指定资源与用户或分组间的直接授权，不影响其他用户/分组的授权；不存在的授权视为成功，允许撤销已停用或已删除的接收对象。任一资源无权操作则整批回滚。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareResourcesInput'
      responses:
        '204':
          description: 整批撤销成功，无响应体。
        '400':
          $ref: '#/components/responses/ResourceError400'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceError404'
        '500':
          $ref: '#/components/responses/ResourceError500'
