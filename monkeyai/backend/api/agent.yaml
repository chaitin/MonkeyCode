  /api/v1/resources/shares:
    post:
      summary: 批量分享自己的资源给指定用户
      description: 支持 model、skill、rule；Connector 和 Provider 暂不支持分享。分享为追加的只读使用授权，不覆盖其他接收用户；重复授权不会产生重复记录。每批资源和用户各 1—100 项，任一资源非本人所有或任一接收用户无效时整批回滚。禁止分享给自己，不允许接收方转分享。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareResourcesInput'
      responses:
        '204':
          description: 整批分享成功，无响应体。
        '400':
          $ref: '#/components/responses/ResourceError400'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceError404'
        '500':
          $ref: '#/components/responses/ResourceError500'
    delete:
