  /api/v1/billing/account:
    get:
      summary: 查询当前用户积分状态
      description: 使用 Bearer access token 确定用户，返回当前周期额度、余额及可用积分（等于余额）；冻结字段为兼容旧客户端保留，迁移后为零；周期到期后按最新额度创建新账户。余额和可用积分可能为负数，不应截断为零。
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditAccount'
        '400':
          description: 参数不合法
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: 修订号、幂等键或交易状态冲突
  /api/v1/billing/entries:
    get:
      summary: 分页查询当前用户积分消耗历史
      description: 仅返回当前 Bearer access token 所属用户的扣费和退款记录，不包含额度发放、重置或管理员调整；默认查询所有周期，按发生时间、记录 ID 倒序排列。用户身份由服务端确定，不支持指定其他用户或分组，不返回内部元数据。
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - in: query
        name: content
        description: 按消费项目名称模糊搜索。
        schema:
          type: string
          maxLength: 200
      - in: query
        name: category
        schema:
          type: string
          enum: [model, tool, other]
      - in: query
        name: mode
        schema:
          type: string
          enum: [local, remote]
      - in: query
        name: entry_type
        description: 不指定时同时返回扣费和退款。
        schema:
          type: string
          enum: [charge, refund]
      - in: query
        name: from
        description: 起始时间（含），须携带时区。
        schema:
          type: string
          format: date-time
      - in: query
        name: until
        description: 结束时间（不含），须携带时区，且晚于起始时间。
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: 请求成功；无记录时 items 为 []。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditEntriesResponse'
        '400':
          description: 搜索条件、时间范围或流水类型不合法
        '401':
          description: 缺少、无效或已过期的 access token
        '500':
          $ref: '#/components/responses/ResourceError500'
  /mcp/connectors/{id}:
    parameters:
    - in: path
      name: id
      schema:
        type: string
        format: uuid
      required: true
    - in: header
      name: MCP-Protocol-Version
      description: 后续请求应携带握手协商的版本；未知版本返回 400。
      schema:
        type: string
        enum:
        - '2024-11-05'
        - '2025-03-26'
        - '2025-06-18'
        - '2025-11-25'
    post:
      summary: 调用免认证连接的 MCP 网关
      description: 仅用于免认证连接，使用全局 mcp:invoke API Key 认证用户并校验连接使用权。集中和独立认证必须改用具体凭证地址，省略凭证返回 400 credential_selection_required。
        tools/list 和 tools/call 使用上游原始工具名称，并执行实时工具启停检查。
      security:
      - InvocationKey: []
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          maxLength: 128
      - in: header
        name: X-Session-ID
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  const: '2.0'
                id:
                  type:
                  - string
                  - number
                  description: 请求必须携带，通知省略；原值随响应返回。
                method:
                  type: string
                  examples:
                  - initialize
                  - notifications/initialized
                  - ping
                  - tools/list
                  - tools/call
                params:
                  type: object
                  description: tools/call 使用精确工具名称 name 和对象 arguments，保留 _meta 等扩展字段；tools/list 返回完整目录，不接受非空 cursor。
              required:
              - jsonrpc
              - method
      responses:
        '200':
          description: JSON-RPC 结果或协议错误
          headers:
            X-Billing-Transaction-ID:
              schema:
                type: string
                format: uuid
            X-Billing-Status:
              schema:
                type: string
                enum:
                - pending
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    const: '2.0'
                  id:
                    type:
                    - string
                    - number
                    - 'null'
                  result: {}
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
                      data: {}
                    required:
                    - code
                    - message
                required:
                - jsonrpc
                - id
        '202':
          description: 已接收通知，响应体为空
        '400':
          description: 请求格式、参数或协议版本不合法
        '401':
          description: 调用密钥缺失、失效或没有 mcp:invoke 作用域
        '402':
          description: 积分不足
