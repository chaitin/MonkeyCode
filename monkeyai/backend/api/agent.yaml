components:
  securitySchemes:
    InvocationKey:
      type: http
      scheme: bearer
      description: 含 mcp:invoke 的长期调用密钥。
    OAuthAccessToken:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
      description: Agent 登录授权流程签发的短期 access token。
  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 最近详情响应中的修订号 ETag，例如 "1"；缺省返回 428，已过期返回 412。
      schema:
        type: string
    IfNoneMatch:
      in: header
      name: If-None-Match
      description: 此接口上一次响应的 ETag；当前用户可见内容未变化时返回 304。
      schema:
        type: string
    KeyID:
      in: path
      name: keyID
      required: true
      description: 调用密钥 UUID。
      schema:
        type: string
        format: uuid
  headers:
    RevisionETag:
      description: 资源修订号，以双引号包围，例如 "1"；创建、编辑、分享、撤销分享及删除都会更新修订号。
      schema:
        type: string
    ETag:
      description: 当前接口响应内容的稳定 SHA-256 版本，以双引号包围。
      schema:
        type: string
    CacheControl:
      description: 按用户隔离缓存，每次使用前重新验证。
      schema:
        type: string
        const: private, no-cache
  responses:
    NotModified:
      description: 当前接口内容未变化，无响应体。
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
    ResourceError400:
      description: 字段或关联无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError401:
      description: 需要登录
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError403:
      description: 无权操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError404:
      description: 资源不存在或无权访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError409:
      description: 名称或引用冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError412:
      description: 修订或技能包摘要已变化
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError428:
      description: 缺少 If-Match
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError500:
      description: 读取或保存失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError502:
      description: 上游连接失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    BadRequest:
      description: 请求参数或请求体无效。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 缺少 access token，或 token 无效、已过期。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 指定资源不存在或不属于当前用户。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: 服务内部错误。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    UserRuleInput:
      type: object
      properties:
        content:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - name
      - content
      description: 仅声明的字段可由当前用户写入；归属、启用状态、授权和其他服务端字段忽略。
    UserSkillInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          description: 省略时保留原值。
        content:
          type: string
          description: 省略时保留原值。
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - name
      description: 仅声明的字段可由当前用户写入；归属、启用状态、授权和其他服务端字段忽略。
    UserConnectorInput:
      type: object
      properties:
        provider_id:
          type: string
          format: uuid
        description:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - name
      description: 仅声明的字段可由当前用户写入；归属、启用状态、授权和其他服务端字段忽略。
    UserConnectorProviderInput:
      type: object
      properties:
        description:
          type: string
        url:
          type: string
          format: uri
        authorization_mode:
          type: string
          enum:
          - none
          - independent
        authorization_method:
          type:
          - string
          - 'null'
          enum:
          - http_header
          - oauth
          - null
        oauth_config:
          $ref: '#/components/schemas/OAuthConnectionConfig'
        header_schema:
          type: object
        name:
          type: string
          minLength: 1
          maxLength: 200
        oauth_client_secret:
          type: string
          writeOnly: true
          description: 仅写入；空字符串表示保留已有密钥。
      required:
      - name
      description: 仅声明的字段可由当前用户写入；归属、启用状态、授权和其他服务端字段忽略。
    UserConnectorProviderResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        revision:
          type: integer
          minimum: 1
        ownership_type:
          type: string
          enum:
          - system
          - user
        owner_user_id:
          type: string
          format: uuid
        owner_name:
          type: string
        icon_path:
          type: string
        enabled:
          type: boolean
        grants:
          type: array
          items:
            $ref: '#/components/schemas/ResourceGrant'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        description:
          type: string
        url:
          type: string
          format: uri
        authorization_mode:
          type: string
          enum:
          - none
          - centralized
          - independent
        authorization_method:
          type:
          - string
          - 'null'
          enum:
          - http_header
          - oauth
          - null
        oauth_config:
          $ref: '#/components/schemas/OAuthConnectionConfig'
        header_schema:
          type: object
      required:
      - id
      - name
      - revision
      - ownership_type
      - owner_user_id
    UserSkillManifest:
      type: object
      required:
      - name
      - description
      - content
      - revision
      properties:
        name:
          type: string
        description:
          type: string
        content:
          type: string
        revision:
          type: integer
    EmailAuthError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
    EmailLoginMethods:
      type: object
      required:
        - password_enabled
        - email_code_enabled
        - registration_enabled
      properties:
        password_enabled:
          type: boolean
          description: 密码登录开关，未配置时默认 true，同时约束管理员和普通用户。
        email_code_enabled:
          type: boolean
          description: 验证码登录开关，默认 false。
        registration_enabled:
          type: boolean
          description: 自助注册开关，默认 false。
    EmailAuthUser:
      type: object
      required:
        - id
        - name
        - email
        - role
        - status
        - joined_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
          maxLength: 254
          description: 邮箱会去除首尾空白并转为小写。
        role:
          type: string
          enum:
            - admin
            - user
        status:
          type: string
          enum:
            - active
            - disabled
        joined_at:
          type: string
          format: date-time
        avatar_url:
          type: string
        last_login_at:
          type: string
          format: date-time
    CreditAmount:
      type: string
      pattern: ^-?\d+(\.\d{1,6})?$
      description: 十进制定点积分，最多六位小数。
    CreditAccount:
      type: object
      properties:
        version:
          type: string
          description: 当前账户的版本，随账本变更更新；用于管理员调整时检查并发及重复提交，历史账户条目可省略。
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        period_start_at:
          type: string
          format: date-time
        period_end_at:
          type: string
          format: date-time
        balance:
          $ref: '#/components/schemas/CreditAmount'
        frozen:
          $ref: '#/components/schemas/CreditAmount'
        available:
          $ref: '#/components/schemas/CreditAmount'
        quota:
          $ref: '#/components/schemas/CreditAmount'
      required:
      - id
      - user_id
      - balance
      - frozen
      - available
      - quota
      - period_start_at
      - period_end_at
    UserSummary:
      type: object
      required:
      - id
      - name
      - email
      properties:
        id: &id006
          type: string
          format: uuid
        name:
          type: string
          description: 用户名。
        email:
          type: string
          format: email
    SearchUsersResponse:
      type: object
      required:
      - users
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
    AgentModelsResponse:
      type: object
      required:
      - version
      - models
      - model_gateway
      additionalProperties: false
      properties:
        version:
          $ref: '#/components/schemas/ResourceVersion'
        models:
          type: array
          description: 当前用户可用的资源，空集合返回 []。
          items:
            $ref: '#/components/schemas/AgentModel'
        model_gateway:
          $ref: '#/components/schemas/ModelGateway'
    UserModelInput:
      type: object
      required:
      - model_id
      - display_name
      - protocol
      - base_url
      - advanced_config
      properties:
        model_id: &id001
          type: string
          description: 上游模型名称，非代理调用时的内部模型 ID。
        display_name: &id002
          type: string
          description: 展示名称。
        protocol: &id003
          type: string
          enum:
          - openai_chat_completions
          - openai_responses
          - anthropic
        base_url: &id004
          type: string
          format: uri
          description: 上游 HTTP(S) 地址，不允许包含用户名密码。
        api_key:
          type: string
          writeOnly: true
          description: 上游密钥，仅写入；更新时省略或为空表示保留。
        advanced_config: &id005
          type: object
          required:
          - context_window_tokens
          - max_output_tokens
          - supports_vision
          properties:
            context_window_tokens:
              type: integer
              format: int64
              minimum: 1
            max_output_tokens:
              type: integer
              format: int64
              minimum: 1
            supports_vision:
              type: boolean
    CreateUserModelInput:
      allOf:
      - $ref: '#/components/schemas/UserModelInput'
      - type: object
        required:
        - api_key
        properties:
          api_key:
            type: string
            minLength: 1
            writeOnly: true
    UserModel:
      type: object
      required:
      - id
      - ownership_type
      - owner_user_id
      - model_id
      - display_name
      - protocol
      - base_url
      - api_key_configured
      - advanced_config
      - credit_multiplier
      - authorization
      - enabled
      - created_at
      - updated_at
      properties:
        model_id: *id001
        display_name: *id002
        protocol: *id003
        base_url: *id004
        advanced_config: *id005
        id: *id006
        ownership_type:
          type: string
          const: user
        owner_user_id: *id006
        api_key_configured:
          type: boolean
        credit_multiplier:
          type: number
          exclusiveMinimum: 0
          description: 服务端管理，用户不可修改。
        authorization:
          type: object
          required:
          - user_ids
          - group_ids
          properties:
            user_ids:
              type: array
              items: *id006
            group_ids:
              type: array
              items: *id006
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ShareResourcesInput:
      type: object
      required:
      - resources
      - user_ids
      properties:
        resources:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required:
            - type
            - id
            properties:
              type:
                type: string
                enum:
                - model
                - skill
                - rule
                description: 可分享的个人资源类型；其他类型返回 400。
              id: *id006
        user_ids:
          type: array
          minItems: 1
          maxItems: 100
          items: *id006
          description: 接收用户 ID，重复项自动去重。
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 供调用方识别错误类别的稳定代码。
          examples: [api_key_error]
        message:
          type: string
          description: 面向用户或开发者的错误说明。
    ResourceVersion:
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
      description: 当前接口实际下发内容的 SHA-256 摘要，不包含 version 字段。
    AgentSettingsResponse:
      type: object
      required:
      - version
      - settings
      additionalProperties: false
      properties:
        version:
          $ref: '#/components/schemas/ResourceVersion'
        settings:
          $ref: '#/components/schemas/AgentSettings'
    AgentRulesResponse:
      type: object
      required:
      - version
      - rules
      additionalProperties: false
      properties:
        version:
          $ref: '#/components/schemas/ResourceVersion'
        rules:
          type: array
          description: 当前用户可用的资源，空集合返回 []。
          items:
            $ref: '#/components/schemas/AgentRule'
    AgentSkillsResponse:
      type: object
      required:
      - version
      - skills
      additionalProperties: false
      properties:
        version:
          $ref: '#/components/schemas/ResourceVersion'
        skills:
          type: array
          description: 当前用户可用的资源，空集合返回 []。
          items:
            $ref: '#/components/schemas/AgentSkill'
    AgentExpertsResponse:
      type: object
      required:
      - version
      - experts
      additionalProperties: false
      properties:
        version:
          $ref: '#/components/schemas/ResourceVersion'
        experts:
          type: array
          description: 当前用户可用的资源，空集合返回 []。
          items:
            $ref: '#/components/schemas/AgentExpert'
    AgentConnectorsResponse:
      type: object
      required:
      - version
      - connectors
      additionalProperties: false
      properties:
        version:
          $ref: '#/components/schemas/ResourceVersion'
        connectors:
          type: array
          description: 当前用户可用的资源，空集合返回 []。
          items:
            $ref: '#/components/schemas/AgentConnector'
    AgentSettings:
      type: object
      description: 按设置域组织的全局设置；只返回已配置的设置域，服务端密钥字段已移除。
      properties:
        branding:
          $ref: "#/components/schemas/BrandingSettings"
        authentication:
          $ref: "#/components/schemas/AuthenticationSettings"
        email:
          $ref: "#/components/schemas/EmailSettings"
        billing:
          $ref: "#/components/schemas/BillingSettings"
      additionalProperties:
        type: object
        description: 后续新增设置域的配置对象。
    BrandingSettings:
      type: object
      required: [workspace_name, product_name]
      properties:
        workspace_name:
          type: string
          description: 工作区名称。
        product_name:
          type: string
          description: Agent 向用户展示的产品名称。
      additionalProperties: true
    AuthenticationSettings:
      type: object
      properties:
        registration_enabled:
          type: boolean
          description: 是否允许新用户注册。
        password_enabled:
          type: boolean
          description: 是否允许密码登录。
        email_code_enabled:
          type: boolean
          description: 是否允许邮箱验证码登录。
        oauth_connections:
          type: array
          description: 已配置的 OAuth 登录连接；不包含 client_secret。
          items:
            $ref: "#/components/schemas/OAuthConnection"
      additionalProperties: true
    OAuthConnection:
      type: object
      required: [id, provider, name, client_id, enabled]
      properties:
        id:
          type: string
          description: OAuth 连接的稳定标识。
        provider:
          type: string
          enum: [github, google, microsoft, gitlab, oidc, baizhiyun]
          description: OAuth 或 OIDC 提供方。
        name:
          type: string
          description: 登录界面展示的连接名称。
        client_id:
          type: string
          description: OAuth Client ID。
        issuer_url:
          type: string
          format: uri
          description: OIDC Issuer URL；oidc 和 baizhiyun 必填，其他连接可不返回。
        authorization_url:
          type: string
          format: uri
          description: 自定义授权端点；使用提供方默认端点时可不返回。
        token_url:
          type: string
          format: uri
          description: 自定义 Token 端点；使用提供方默认端点时可不返回。
        userinfo_url:
          type: string
          format: uri
          description: 自定义用户信息端点；使用提供方默认端点时可不返回。
        scopes:
          type: array
          description: 请求上游授权时使用的 Scope；使用默认 Scope 时可不返回。百智云默认为 auth_certification、openid、phone、user。
          items:
            type: string
        enabled:
          type: boolean
          description: 此登录连接是否启用。
      additionalProperties: true
    EmailSettings:
      type: object
      properties:
        sender_name:
          type: string
          description: 邮件发件人名称。
        sender_email:
          type: string
          format: email
          description: 邮件发件人地址。
        smtp_host:
          type: string
          description: SMTP 服务器主机名。
        smtp_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: SMTP 服务器端口。
        smtp_username:
          type: string
          description: SMTP 登录用户名。
        smtp_encryption:
          type: string
          enum: [none, starttls, tls]
          description: SMTP 连接加密方式。
      additionalProperties: true
    BillingSettings:
      type: object
      properties:
        input_credits_per_million_tokens:
          $ref: '#/components/schemas/CreditAmount'
          description: 每百万输入 Token 消耗的积分。
        cached_input_credits_per_million_tokens:
          $ref: '#/components/schemas/CreditAmount'
          description: 每百万缓存输入 Token 消耗的积分。
        output_credits_per_million_tokens:
          $ref: '#/components/schemas/CreditAmount'
          description: 每百万输出 Token 消耗的积分。
        quota_refresh_cycle:
          type: string
          enum:
          - daily
          - weekly
          - monthly
          description: 积分额度刷新周期。
        charging_mode:
          description: local 为本地扣费；remote 为百智云扣费，仅具有有效百智云登录身份的用户可访问系统资源，用户自建资源仍遵循原授权。
          type: string
          enum:
          - local
          - remote
        enabled:
          type: boolean
          description: 是否启用计费。
      additionalProperties: false
    ModelGateway:
      type: object
      required: [base_url, authentication]
      properties:
        base_url:
          type: string
          format: uri
          description: 兼容模型 SDK 的代理 Base URL。
        authentication:
          type: string
          enum: [api_key]
          description: 模型代理使用用户创建的调用密钥鉴权。
    AgentModel:
      type: object
      required:
        - ownership_type
        - owner_user_id
        - id
        - model
        - display_name
        - protocol
        - context_window_tokens
        - max_output_tokens
        - supports_vision
        - credit_multiplier
      properties:
        ownership_type:
          type: string
          enum:
          - system
          - user
          description: 资源归属，固定为 system 或 user；分享不会改变此值。自有和他人分享的个人模型均为 user，通过 owner_user_id 区分。
        owner_user_id:
          type: string
          format: uuid
          description: 创建者用户 ID。
        creator:
          $ref: '#/components/schemas/UserSummary'
          description: 他人创建的用户模型返回创建者；自己的模型和系统模型不返回。
        shared_users:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
          description: 仅自己的用户模型返回分享用户列表，未分享时为空数组，排除已删除用户。接收方和系统模型不返回此字段。
        id:
          type: string
          format: uuid
          description: MonkeyAI 内部模型 UUID，模型代理兼容使用该值作为请求的 model。
        model:
          type: string
          description: 数据库 models.model_id 中配置的模型名称，Agent 调用模型代理时作为请求的 model 值。
        display_name:
          type: string
          description: Agent 向用户展示的模型名称。
        protocol:
          type: string
          enum: [openai_chat_completions, openai_responses, anthropic]
          description: MonkeyAI 与上游服务通信时使用的协议。
        context_window_tokens:
          type: integer
          format: int64
          minimum: 1
          description: 模型上下文窗口的最大 Token 数。
        max_output_tokens:
          type: integer
          format: int64
          minimum: 1
          description: 单次请求允许生成的最大 Token 数。
        supports_vision:
          type: boolean
          description: 模型是否支持图像输入。
        credit_multiplier:
          type: number
          exclusiveMinimum: 0
          description: 本模型消耗积分时使用的倍率。
    APIKeysResponse:
      type: object
      required: [api_keys]
      properties:
        api_keys:
          type: array
          description: 当前用户的调用密钥元数据，不包含可用于鉴权的密钥原文。
          items:
            $ref: "#/components/schemas/APIKey"
    CreateAPIKeyInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: 便于用户识别密钥用途的名称。
        scopes:
          type: array
          description: 调用权限；不传或传空数组时默认为 model:invoke。
          default: ["model:invoke"]
          uniqueItems: true
          items:
            type: string
            enum: ["model:invoke", "mcp:invoke"]
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
