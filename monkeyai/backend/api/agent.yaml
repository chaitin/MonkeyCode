  /v1/images/inputs:
    post:
      summary: 上传当前用户的生图参考图片
      description: 调用密钥需要 model:invoke 权限；仅接受一张不超过 16 MiB 的 PNG/JPEG。
      security: [{ModelInvocationKey: []}, {ModelApiKey: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: 用户专属文件，24 小时内可用于生图任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageInputFile'}
        '400': {$ref: '#/components/responses/ResourceError400'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/images/generations:
    post:
      summary: 创建生图任务
      description: 原生异步接口，返回任务 ID；不与 OpenAI Images 同路径同步语义兼容。
      security: [{ModelInvocationKey: []}, {ModelApiKey: []}]
      parameters:
        - {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImageGenerateInput'}
      responses:
        '202':
          description: 任务已受理，客户端用任务 ID 查询结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageTask'}
        '400': {$ref: '#/components/responses/ResourceError400'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/ResourceError409'}
  /v1/images/edits:
    post:
      summary: 创建图片编辑任务
      description: 仅模型原生支持编辑时开放；images 引用此前上传的原图。
      security: [{ModelInvocationKey: []}, {ModelApiKey: []}]
      parameters:
        - {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImageEditInput'}
      responses:
        '202':
          description: 编辑任务已受理
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageTask'}
        '400': {$ref: '#/components/responses/ResourceError400'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/ResourceError409'}
  /v1/images/tasks/{id}:
    get:
      summary: 查询当前用户的生图任务
      description: 返回本地任务状态、图片访问地址与用量；结果图片到期后返回 expired 状态。
      security: [{ModelInvocationKey: []}, {ModelApiKey: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200':
          description: 当前用户的任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageTask'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/ResourceError404'}
  /v1/images/outputs/{id}:
    get:
      summary: 下载当前用户的生图结果
      description: 需要调用密钥；图片到期或不属于当前用户时返回 404。
      security: [{ModelInvocationKey: []}, {ModelApiKey: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200':
          description: 生图内容，仅返回 PNG、JPEG 或 WebP
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/ResourceError404'}
  /api/v1/feedback:
    post:
      summary: 提交用户反馈
      description: >-
        使用 Agent OAuth access token 提交文字反馈和可选截图。请求使用 multipart/form-data，最多上传 3 张
        PNG、JPEG 或 WebP 图片，单张最多 5 MiB，总请求最多 16 MiB。content 和 images 至少提供一项。
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 建议客户端为可重试请求提供；同一用户相同 Key 和请求内容只创建一条反馈。
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FeedbackMultipartInput'
      responses:
        '201':
          description: 反馈已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackSubmission'
        '200':
          description: 幂等键命中已有反馈
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackSubmission'
        '400': {$ref: '#/components/responses/ResourceError400'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/ResourceError409'}
        '500': {$ref: '#/components/responses/ResourceError500'}
components:
  securitySchemes:
    DesignMediaBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 仅aud=monkeyai-design-media，不能使用Agent access token或hub JWT
    DesignMediaQuery:
      type: apiKey
      in: query
      name: token
      description: 短期本地媒体JWT；存在Authorization时优先使用它且失败不降级
    RuntimeTicket:
      type: http
      scheme: bearer
      description: 只允许指定目标设备和批准业务权限的短期票据；WebSocket 使用 monkeyai.v1 与 monkeyai.token.<ticket> 子协议。
    BrowserSession:
      type: apiKey
      in: cookie
      name: monkeyai_session
      description: 浏览器登录会话；新增 scope 确认同时要求绑定申请的 CSRF token。
    ModelInvocationKey:
      type: http
      scheme: bearer
      description: 带 model:invoke 权限的长期调用密钥。
    ModelApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: 同一调用密钥，优先于 Authorization Bearer。
    InvocationKey:
      type: http
      scheme: bearer
      description: 含 mcp:invoke 的长期调用密钥。
    OAuthAccessToken:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
      description: Agent 登录授权流程签发的短期 access token。
  parameters:
    EndpointMachine:
      name: machine_id
      in: path
      required: true
      description: 规范小写、带连字符的 UUIDv4，仅限当前用户端点
      schema: {type: string, format: uuid}
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 最近详情响应中的修订号 ETag，例如 "1"；缺省返回 428，已过期返回 412。
      schema:
        type: string
    IfNoneMatch:
      in: header
      name: If-None-Match
      description: 此接口上一次响应的 ETag；当前用户可见内容未变化时返回 304。
      schema:
        type: string
    AgentSearch:
      name: q
      in: query
      description: 按名称或描述做不区分大小写的包含匹配；模型与规则没有描述字段，仅匹配名称。与 owner、标签组合后再分页，total_count 为筛选后的总数。
      schema: {type: string}
    AgentOwner:
      name: owner
      in: query
      description: 资源归属筛选。team 为系统资源；mine 为本人创建的个人资源；shared 为其他用户分享给当前用户的个人资源。
      schema: {type: string, enum: [all, team, mine, shared], default: all}
    AgentTagID:
      name: tag_id
      in: query
      description: 单标签筛选，兼容旧调用；与 tag_ids 同时传入时匹配任一标签。
      schema: {type: string, format: uuid}
    AgentTagIDs:
      name: tag_ids
      in: query
      style: form
      explode: true
      description: 多标签筛选，可重复传入或以逗号分隔；匹配任一标签（OR），不重复返回资源，total_count 为筛选后总数。
      schema:
        type: array
        items: {type: string, format: uuid}
    AgentPage:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1, maximum: 1000000}
    AgentPageSize:
      name: page_size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    KeyID:
      in: path
      name: keyID
      required: true
      description: 调用密钥 UUID。
      schema:
        type: string
        format: uuid
  headers:
    RevisionETag:
      description: 资源修订号，以双引号包围，例如 "1"；创建、编辑、分享、撤销分享及删除都会更新修订号。
      schema:
        type: string
    ETag:
      description: 当前接口响应内容的稳定 SHA-256 版本，以双引号包围。
      schema:
        type: string
    CacheControl:
      description: 按用户隔离缓存，每次使用前重新验证。
      schema:
        type: string
        const: private, no-cache
  responses:
    EndpointResult:
      description: 当前端点资料，时间为 Unix 毫秒
      headers:
        Cache-Control: {schema: {type: string, const: 'private, no-store'}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Endpoint'}
    EndpointUnavailable:
      description: 认证或存储暂不可用、连接数超限，或服务正在停止
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ResourceError'}
    NotModified:
      description: 当前接口内容未变化，无响应体。
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
    ResourceError400:
      description: 字段或关联无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError401:
      description: 需要登录
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError403:
      description: 无权操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError404:
      description: 资源不存在或无权访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError409:
      description: 名称或引用冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError412:
      description: 修订或技能包摘要已变化
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError428:
      description: 缺少 If-Match
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError500:
      description: 读取或保存失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    ResourceError502:
      description: 上游连接失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceError'
    BadRequest:
      description: 请求参数或请求体无效。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 缺少 access token，或 token 无效、已过期。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 指定资源不存在或不属于当前用户。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: 服务内部错误。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    DesignSnapshot:
      type: object
      required: [publisher_id, release_id, schema_version, digest_schema]
      properties:
        publisher_id: {type: string}
        release_id: {type: string}
        schema_version: {type: integer, const: 1}
        digest_schema: {type: string, const: design-content-v1}
    DesignConfig:
      type: object
      required: [schema_version, publisher_id, respub, monkeyai]
      properties:
        schema_version: {type: integer, const: 1}
        publisher_id: {type: [string, 'null']}
        respub:
          type: [object, 'null']
          properties: {base_url: {type: string, format: uri}}
        monkeyai:
          type: object
          required: [base_url, available, snapshot]
          properties:
            base_url: {type: string, format: uri}
            available: {type: boolean}
            snapshot:
              oneOf:
                - {$ref: '#/components/schemas/DesignSnapshot'}
                - {type: 'null'}
    DesignEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: {type: [integer, string], description: 成功0，失败字符串错误码}
        message: {type: string}
        data: {}
    DesignPage:
      type: object
      required: [items, total, page, page_size, total_pages, asset_snapshot_id]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/DesignEntry'}}
        total: {type: integer}
        page: {type: integer}
        page_size: {type: integer}
        total_pages: {type: integer}
        asset_snapshot_id: {type: string}
    DesignEntry:
      type: object
      required: [id, content_digest, asset_snapshot_id]
      properties:
        id: {type: string}
        content_digest: {type: string}
        asset_snapshot_id: {type: string}
        skillPath: {type: string, description: 原始业务字段，保留摘要输入}
        source_skill_path: {type: [string, 'null'], description: 仅模板详情；解析后的逻辑路径，跨项目互验待验收}
        files:
          type: array
          items:
            type: object
            required: [path, sha256, size, mime]
            properties:
              path: {type: string}
              sha256: {type: string}
              size: {type: integer, minimum: 0}
              mime: {type: string}
              role: {type: string}
        download:
          type: [object, 'null']
          properties: {url: {type: string, format: uri}}
        download_url: {type: string, format: uri}
    FeedbackMultipartInput:
      type: object
      additionalProperties: false
      required: [category]
      properties:
        category:
          type: string
          enum: [bug, feature, experience, other]
        content:
          type: string
          maxLength: 5000
        rating:
          type: integer
          minimum: 1
          maximum: 5
        platform:
          type: string
          enum: [desktop, mobile, web, other]
          default: other
        client_version:
          type: string
          maxLength: 64
        images:
          type: array
          maxItems: 3
          items:
            type: string
            format: binary
          description: PNG、JPEG 或 WebP 图片；单张最多 5 MiB。
    FeedbackSubmission:
      type: object
      additionalProperties: false
      required: [id, created_at, attachments]
      properties:
        id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/FeedbackAttachment'
    FeedbackAttachment:
      type: object
      additionalProperties: false
      required: [id, mime_type, byte_size, width, height, downloadable]
      properties:
        id: {type: string, format: uuid}
        mime_type:
          type: string
          enum: [image/png, image/jpeg, image/webp]
        byte_size: {type: integer, format: int64, minimum: 1}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        downloadable: {type: boolean}
    SessionSummary:
      type: object
      required: [id, machine_id, session_type, state_seq, host_revision, device_status, stale]
      properties:
        id: {type: string, format: uuid}
        machine_id: {type: string, format: uuid}
        session_type: {type: string}
        parent_session_id: {type: [string, 'null'], format: uuid}
        title: {type: string, description: 仅 full 策略返回}
        title_source: {type: [string, 'null']}
        state_seq: {type: integer, format: int64}
        host_revision: {type: integer, format: int64}
        started_at: {type: string, format: date-time}
        last_active_at: {type: [string, 'null'], format: date-time}
        reported_at: {type: [string, 'null'], format: date-time}
        device_status: {type: string}
        stale: {type: boolean}
    RuntimeDirectory:
      type: object
      required: [items, total, page, page_size, version]
      properties:
        items:
          type: array
          items:
            type: object
            required: [machine_id, display_name, execution_supported, remote_access_state, status, protocols]
            properties:
              machine_id: {type: string, format: uuid}
              display_name: {type: string}
              platform: {type: string}
              arch: {type: string}
              execution_supported: {type: boolean}
              remote_access_state: {type: string, enum: [disabled, enabled, revoked]}
              deployment_mode: {type: string, enum: ['', desktop_managed, standalone]}
              status: {type: string, enum: [online, offline, auth_required, draining, updating, incompatible, revoked]}
              last_seen_at: {type: [string, 'null'], format: date-time}
              runtime_version: {type: [string, 'null']}
              engine_version: {type: [string, 'null']}
              protocols: {type: object, additionalProperties: {type: array, items: {type: integer}}}
              capability_summary: {type: object}
              engine_health: {type: string}
              boot_id: {type: string, format: uuid}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1}
        version: {type: string, minLength: 1}
    Endpoint:
      type: object
      required: [machine_id, device_name, alias, display_name, platform, os_version, arch, client_version, protocol_version, status, online, created_at, updated_at, last_seen_at, revoked_at]
      properties:
        machine_id: {type: string, format: uuid}
        device_name: {type: string}
        alias: {type: [string, 'null']}
        display_name: {type: string}
        platform: {type: string, minLength: 1, maxLength: 64, description: 客户端上报的平台名称，最多 64 个 UTF-8 字节。}
        os_version: {type: string}
        arch: {type: string}
        client_version: {type: string}
        protocol_version: {type: integer, const: 1}
        status: {type: string, enum: [active, revoked]}
        online: {type: boolean}
        created_at: {type: integer, format: int64}
        updated_at: {type: integer, format: int64}
        last_seen_at: {type: [integer, 'null'], format: int64}
        revoked_at: {type: [integer, 'null'], format: int64}
    UserRuleInput:
      type: object
      properties:
        content:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - name
      - content
      description: 仅声明的字段可由当前用户写入；归属、启用状态、授权和其他服务端字段忽略。
    UserSkillInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          description: 省略时保留原值。
        content:
          type: string
          description: 省略时保留原值。
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - name
      description: 仅声明的字段可由当前用户写入；归属、启用状态、授权和其他服务端字段忽略。
    UserExpertInput:
      type: object
      properties:
        tag_ids:
          type: array
          items: {type: string, format: uuid}
        description:
          type: string
        prompt:
          type: string
        rule_ids:
          type: array
          items:
            type: string
            format: uuid
        skill_ids:
          type: array
          items:
            type: string
            format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        connectors:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorDependency'
      required:
      - name
    UserConnectorInput:
      type: object
      properties:
        tag_ids:
          type: array
          items: {type: string, format: uuid}
        description:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 200
        url:
          type: string
          format: uri
        authorization_mode:
          type: string
          enum:
          - none
          - independent
        authorization_method:
          type:
          - string
          - 'null'
          enum:
          - oauth
          - http_header
          - null
        oauth_config:
          $ref: '#/components/schemas/OAuthConnectionConfig'
        oauth_client_secret:
          type: string
          writeOnly: true
          description: 省略保留，空字符串清空；应用或端点变更时省略会清除旧 Secret。
      required:
      - name
      description: 仅声明的字段可由当前用户写入；归属、启用状态、授权和其他服务端字段忽略。
    UserSkillManifest:
      type: object
      required:
      - name
      - description
      - content
      - revision
      properties:
        name:
          type: string
        description:
          type: string
        content:
          type: string
        revision:
          type: integer
    EmailAuthError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
    EmailLoginMethods:
      type: object
      required:
        - password_enabled
        - email_code_enabled
        - email_code_auto_registration_enabled
      properties:
        password_enabled:
          type: boolean
          description: 密码登录开关，未配置时默认 true，同时约束管理员和普通用户。
        email_code_enabled:
          type: boolean
          description: 验证码登录开关，默认 false。
        email_code_auto_registration_enabled:
          type: boolean
          description: 邮箱验证码自动注册开关，默认 false；开启后新邮箱通过验证码登录时自动创建普通账号。
    EmailAuthUser:
      type: object
      required:
        - id
        - name
        - email
        - role
        - status
        - joined_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
          maxLength: 254
          description: 邮箱会去除首尾空白并转为小写。
        role:
          type: string
          enum:
            - admin
            - user
        status:
          type: string
          enum:
            - active
            - disabled
        joined_at:
          type: string
          format: date-time
        avatar_url:
          type: string
        last_login_at:
          type: string
          format: date-time
    CreditAmount:
      type: string
      pattern: ^-?\d+(\.\d{1,6})?$
      description: 十进制定点积分，最多六位小数。
    CreditAccount:
      type: object
      properties:
        version:
          type: string
          description: 当前账户的版本，随账本变更更新；用于管理员调整时检查并发及重复提交，历史账户条目可省略。
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        period_start_at:
          type: string
          format: date-time
        period_end_at:
          type: string
          format: date-time
        balance:
          $ref: '#/components/schemas/CreditAmount'
        frozen:
          $ref: '#/components/schemas/CreditAmount'
          description: 兼容字段，迁移后为零。
        available:
          $ref: '#/components/schemas/CreditAmount'
        quota:
          $ref: '#/components/schemas/CreditAmount'
      required:
      - id
      - user_id
      - balance
      - frozen
      - available
      - quota
      - period_start_at
      - period_end_at
    CreditEntriesResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreditConsumptionEntry'
        total:
          type: integer
          format: int64
        page:
          type: integer
        page_size:
          type: integer
    CreditConsumptionEntry:
      type: object
      additionalProperties: false
      required: [id, transaction_id, entry_type, category, item_name, credit_delta, balance_after, mode, occurred_at]
      properties:
        id:
          type: string
          format: uuid
        transaction_id:
          type: [string, 'null']
          format: uuid
        entry_type:
          type: string
          enum: [charge, refund]
        category:
          type: string
          enum: [model, tool, other]
        item_name:
          type: string
        credit_delta:
          $ref: '#/components/schemas/CreditAmount'
          description: 本条积分变动，扣费为负、退款为正。
        balance_after:
          $ref: '#/components/schemas/CreditAmount'
          description: 本条发生后对应周期账户的余额，可能为负数。
        mode:
          type: string
          enum: [local, remote]
        occurred_at:
          type: string
          format: date-time
    UserSummary:
      type: object
      required:
      - id
      - name
      - email
      properties:
        id: &id006
          type: string
          format: uuid
        name:
          type: string
          description: 用户名。
        email:
          type: string
          format: email
    GroupSummary:
      type: object
      required: [id, name, parent_id]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        parent_id:
          type: [string, 'null']
          format: uuid
          description: 顶层分组的父 ID 为全零 UUID 的虚拟根组 ID；根组自身为 null，可作为全员分享对象。
    SearchGroupsResponse:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items: {$ref: '#/components/schemas/GroupSummary'}
    SearchUsersResponse:
      type: object
      required:
      - users
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
    AgentTagsResponse:
      type: object
      required: [version, tags]
      properties:
        version:
          $ref: '#/components/schemas/ResourceVersion'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/ResourceTag'
    AgentModelsResponse:
      type: object
      required:
      - version
      - models
      - model_gateway
      - total_count
      - page
      - page_size
      additionalProperties: false
      properties:
        version:
          $ref: '#/components/schemas/ResourceVersion'
        total_count: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1}
        models:
          type: array
          description: 当前用户可用的资源，空集合返回 []。
          items:
            $ref: '#/components/schemas/AgentModel'
        model_gateway:
          $ref: '#/components/schemas/ModelGateway'
    UserModelInput:
      type: object
      required:
      - model_id
      - display_name
      - protocol
      - base_url
      properties:
        model_id: &id001
          type: string
          description: 上游模型名称，非代理调用时的内部模型 ID。
        display_name: &id002
          type: string
          description: 展示名称。
        protocol: &id003
          type: string
          enum:
          - openai_chat_completions
          - openai_responses
          - anthropic
          - image_generation
          - video_generation
        kind:
          type: string
          enum: [text, image, video]
          default: text
        provider:
          type: string
          enum: [passthrough, openai_images, openai_responses_image, volcengine, xai, agnes]
        image_config:
          $ref: '#/components/schemas/AgentImageConfig'
        base_url: &id004
          type: string
          format: uri
          description: 上游 HTTP(S) 地址，不允许包含用户名密码。
        api_key:
          type: string
          writeOnly: true
          description: 上游密钥，仅写入；更新时省略或为空表示保留。
        tag_ids:
          type: array
          items: {type: string, format: uuid}
        advanced_config: &id005
          type: object
          required:
          - context_window_tokens
          - max_output_tokens
          - supports_vision
          properties:
            context_window_tokens:
              type: integer
              format: int64
              minimum: 0
            max_output_tokens:
              type: integer
              format: int64
              minimum: 0
            supports_vision:
              type: boolean
            supports_reasoning:
              type: boolean
              default: false
    CreateUserModelInput:
      allOf:
      - $ref: '#/components/schemas/UserModelInput'
      - type: object
        required:
        - api_key
        properties:
          api_key:
            type: string
            minLength: 1
            writeOnly: true
    UserModel:
      type: object
      required:
      - id
      - ownership_type
      - user
      - model_id
      - display_name
      - protocol
      - kind
      - provider
      - base_url
      - api_key_configured
      - credit_multiplier
      - authorization
      - enabled
      - created_at
      - updated_at
      properties:
        model_id: *id001
        display_name: *id002
        protocol: *id003
        kind:
          type: string
          enum: [text, image, video]
        provider:
          type: string
          enum: [passthrough, openai_images, openai_responses_image, volcengine, xai, agnes]
        image_config:
          $ref: '#/components/schemas/AgentImageConfig'
        image_pricing:
          $ref: '#/components/schemas/AgentImagePricing'
        base_url: *id004
        advanced_config: *id005
        id: *id006
        ownership_type:
          type: string
          const: user
        user:
          $ref: '#/components/schemas/UserSummary'
          readOnly: true
          description: 资源所有者的基本信息；系统资源返回创建者，分享不改变归属。
        api_key_configured:
          type: boolean
        tags:
          type: array
          items: {$ref: '#/components/schemas/ResourceTag'}
        credit_multiplier:
          type: number
          exclusiveMinimum: 0
          description: 服务端管理，用户不可修改。
        shared_groups:
          type: array
          readOnly: true
          items: {$ref: '#/components/schemas/GroupSummary'}
          description: 当前所有者直接分享的分组，未分享时为空数组。
        authorization:
          type: object
          required:
          - user_ids
          - group_ids
          properties:
            user_ids:
              type: array
              items: *id006
            group_ids:
              type: array
              items: *id006
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ShareResourcesInput:
      type: object
      description: user_ids 与 group_ids 至少填写一项，原始数组合计最多 100 项；重复项去重。group_ids 中的全零 UUID 根组表示系统全员授权，包括后续新增用户；撤销根组分享只移除全员授权，保留独立的用户及其他分组授权。
      required:
      - resources
      properties:
        resources:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required:
            - type
            - id
            properties:
              type:
                type: string
                enum:
                - model
                - rule
                - skill
                - connector
                - expert
                description: 可分享的个人资源类型；其他类型返回 400。
              id: *id006
        user_ids:
          type: array
          maxItems: 100
          items: *id006
          description: 接收用户 ID，重复项自动去重。
        group_ids:
          type: array
          maxItems: 100
          items: *id006
          description: 接收分组 ID，重复项自动去重；全零 UUID 表示系统全员授权，不展开成员。
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 供调用方识别错误类别的稳定代码。
          examples: [api_key_error]
        message:
          type: string
          description: 面向用户或开发者的错误说明。
    ResourceVersion:
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
      description: 当前接口实际下发内容的 SHA-256 摘要，不包含 version 字段。
    AgentSettingsResponse:
      type: object
      required:
      - version
      - settings
      additionalProperties: false
      properties:
        version:
          $ref: '#/components/schemas/ResourceVersion'
        settings:
          $ref: '#/components/schemas/AgentSettings'
    AgentRulesResponse:
      type: object
      required:
      - version
      - rules
      - total_count
      - page
      - page_size
      additionalProperties: false
      properties:
        version:
          $ref: '#/components/schemas/ResourceVersion'
        total_count: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1}
        rules:
          type: array
          description: 当前用户可用的资源，空集合返回 []。
          items:
            $ref: '#/components/schemas/AgentRule'
    AgentSkillsResponse:
      type: object
      required:
      - version
      - skills
      - total_count
      - page
      - page_size
      additionalProperties: false
      properties:
        version:
          $ref: '#/components/schemas/ResourceVersion'
        total_count: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1}
        skills:
          type: array
          description: 当前用户可用的资源，空集合返回 []。
          items:
            $ref: '#/components/schemas/AgentSkill'
    AgentExpertsResponse:
      type: object
      required:
      - version
      - experts
      - total_count
      - page
      - page_size
      additionalProperties: false
      properties:
        version:
          $ref: '#/components/schemas/ResourceVersion'
        total_count: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1}
        experts:
          type: array
          description: 当前用户可用的资源，空集合返回 []。
          items:
            $ref: '#/components/schemas/AgentExpert'
    AgentConnectorsResponse:
      type: object
      required:
      - version
      - connectors
      - total_count
      - page
      - page_size
      additionalProperties: false
      properties:
        version:
          $ref: '#/components/schemas/ResourceVersion'
        total_count: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1}
        connectors:
          type: array
          description: 当前用户可用的资源，空集合返回 []。
          items:
            $ref: '#/components/schemas/AgentConnector'
    AgentSettings:
      type: object
      description: 按设置域组织的全局设置；只返回已配置的设置域，服务端密钥字段已移除。
      properties:
        branding:
          $ref: "#/components/schemas/BrandingSettings"
        authentication:
          $ref: "#/components/schemas/AuthenticationSettings"
        email:
          $ref: "#/components/schemas/EmailSettings"
        billing:
          $ref: "#/components/schemas/BillingSettings"
      additionalProperties:
        type: object
        description: 后续新增设置域的配置对象。
    BrandingSettings:
      type: object
      required: [workspace_name, product_name]
      properties:
        workspace_name:
          type: string
          description: 工作区名称。
        product_name:
          type: string
          description: Agent 向用户展示的产品名称。
      additionalProperties: true
    AuthenticationSettings:
      type: object
      properties:
        email_code_auto_registration_enabled:
          type: boolean
          description: 邮箱验证码登录遇到不存在的用户时是否自动创建普通账号；未配置时默认 false。
        password_enabled:
          type: boolean
          description: 是否允许密码登录。
        email_code_enabled:
          type: boolean
          description: 是否允许邮箱验证码登录。
        oauth_connections:
          type: array
          description: 已配置的 OAuth 登录连接；不包含 client_secret。
          items:
            $ref: "#/components/schemas/OAuthConnection"
      additionalProperties: true
    OAuthConnection:
      type: object
      required: [id, provider, name, client_id, enabled]
      properties:
        id:
          type: string
          description: OAuth 连接的稳定标识。
        provider:
          type: string
          enum: [github, google, microsoft, gitlab, oidc, baizhiyun]
          description: OAuth 或 OIDC 提供方。
        name:
          type: string
          description: 登录界面展示的连接名称。
        client_id:
          type: string
          description: OAuth Client ID。
        issuer_url:
          type: string
          format: uri
          description: OIDC Issuer URL；oidc 和 baizhiyun 必填，其他连接可不返回。
        authorization_url:
          type: string
          format: uri
          description: 自定义授权端点；使用提供方默认端点时可不返回。
        token_url:
          type: string
          format: uri
          description: 自定义 Token 端点；使用提供方默认端点时可不返回。
        userinfo_url:
          type: string
          format: uri
          description: 自定义用户信息端点；使用提供方默认端点时可不返回。
        scopes:
          type: array
          description: 请求上游授权时使用的 Scope；使用默认 Scope 时可不返回。百智云默认为 auth_certification、openid、phone、user、email。
          items:
            type: string
        enabled:
          type: boolean
          description: 此登录连接是否启用。
        auto_registration_enabled:
          type: boolean
          default: true
          description: 通过此连接登录且用户不存在时是否自动创建普通账号；未配置时默认 true。
      additionalProperties: true
    EmailSettings:
      type: object
      properties:
        sender_name:
          type: string
          description: 邮件发件人名称。
        sender_email:
          type: string
          format: email
          description: 邮件发件人地址。
        smtp_host:
          type: string
          description: SMTP 服务器主机名。
        smtp_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: SMTP 服务器端口。
        smtp_username:
          type: string
          description: SMTP 登录用户名。
        smtp_encryption:
          type: string
          enum: [none, starttls, tls]
          description: SMTP 连接加密方式。
      additionalProperties: true
    BillingSettings:
      type: object
      properties:
        input_credits_per_million_tokens:
          $ref: '#/components/schemas/CreditAmount'
          description: 每百万输入 Token 消耗的积分。
        cached_input_credits_per_million_tokens:
          $ref: '#/components/schemas/CreditAmount'
          description: 每百万缓存输入 Token 消耗的积分。
        output_credits_per_million_tokens:
          $ref: '#/components/schemas/CreditAmount'
          description: 每百万输出 Token 消耗的积分。
        quota_refresh_cycle:
          type: string
          enum:
          - daily
          - weekly
          - monthly
          description: 积分额度刷新周期。
        charging_mode:
          description: local 为本地扣费；remote 为百智云扣费，仅具有有效百智云登录身份的用户可访问系统资源，用户自建资源仍遵循原授权。
          type: string
          enum:
          - local
          - remote
        enabled:
          type: boolean
          description: 是否启用计费。
      additionalProperties: false
    ModelGateway:
      type: object
      required: [base_url, authentication]
      properties:
        base_url:
          type: string
          format: uri
          description: 兼容模型 SDK 的代理 Base URL。
        authentication:
          type: string
          enum: [api_key]
          description: 模型代理使用用户创建的调用密钥鉴权。
    ImageInputFile:
      type: object
      required: [file_id, mime_type, width, height, expires_at]
      properties:
        file_id: {type: string, format: uuid}
        mime_type: {type: string}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        expires_at: {type: string, format: date-time}
    ImageReference:
      type: object
      required: [file_id]
      properties:
        file_id: {type: string, format: uuid}
    ImageGenerateInput:
      type: object
      additionalProperties: false
      required: [model, prompt]
      properties:
        model: {type: string}
        prompt: {type: string, minLength: 1}
        reference_images:
          type: array
          items: {$ref: '#/components/schemas/ImageReference'}
        quality: {$ref: '#/components/schemas/ImageQuality'}
        aspect_ratio: {type: string, description: '模型目录公布的比例，如 1:1、9:16。'}
        count: {type: integer, minimum: 1}
    ImageEditInput:
      type: object
      additionalProperties: false
      required: [model, prompt, images]
      properties:
        model: {type: string}
        prompt: {type: string, minLength: 1}
        images:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ImageReference'}
        mask: {$ref: '#/components/schemas/ImageReference'}
        quality: {$ref: '#/components/schemas/ImageQuality'}
        aspect_ratio: {type: string}
        count: {type: integer, minimum: 1}
    ImageTask:
      type: object
      required: [id, operation, status]
      properties:
        id: {type: string, format: uuid}
        operation: {type: string, enum: [generate, edit]}
        status: {type: string, enum: [pending, running, succeeded, failed, unknown, expired]}
        outputs:
          type: array
          items:
            type: object
            required: [url, mime_type, width, height]
            properties:
              url: {type: string, description: 相对路径；下载时需要同一调用密钥。}
              mime_type: {type: string}
              width: {type: integer, minimum: 1}
              height: {type: integer, minimum: 1}
        usage:
          type: object
          properties:
            requested_images: {type: integer, minimum: 0}
            generated_images: {type: integer, minimum: 0}
            credits: {type: string, description: 最终结算积分，完成后提供。}
    ImageQuality:
      type: string
      enum: [1K, 2K, 4K]
      description: 平台统一的生图画质档位；具体像素由供应商适配器映射。
    AgentImageConfig:
      type: object
      required: [qualities, aspect_ratios, default_quality, default_aspect_ratio]
      properties:
        qualities:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/ImageQuality'}
        aspect_ratios:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string}
        default_quality: {$ref: '#/components/schemas/ImageQuality'}
        default_aspect_ratio: {type: string}
        operations:
          type: array
          readOnly: true
          items: {type: string, enum: [generate, edit]}
        max_images: {type: integer, minimum: 1, readOnly: true}
        max_reference_images: {type: integer, minimum: 0, readOnly: true}
        supports_reference_image: {type: boolean, readOnly: true}
        supports_mask: {type: boolean, readOnly: true}
        allowed_aspect_ratios:
          type: object
          readOnly: true
          additionalProperties: {type: array, items: {type: string}}
    AgentImageMultiplier:
      type: object
      required: [name, multiplier]
      properties:
        name: {$ref: '#/components/schemas/ImageQuality'}
        multiplier:
          type: string
          description: 大于 0 的十进制倍率，最多 6 位小数。
    AgentImagePricing:
      type: object
      required: [base_credits_per_image]
      properties:
        base_credits_per_image: {type: string}
        quality_multipliers:
          type: array
          items: {$ref: '#/components/schemas/AgentImageMultiplier'}
    AgentModel:
      type: object
      required:
        - ownership_type
        - user
        - id
        - model
        - display_name
        - protocol
        - kind
        - credit_multiplier
      properties:
        ownership_type:
          type: string
          enum:
          - system
          - user
          description: 资源归属，固定为 system 或 user；分享不会改变此值。自有和他人分享的个人模型均为 user，通过 user.id 与当前用户 ID 比较区分。
        user:
          $ref: '#/components/schemas/UserSummary'
          readOnly: true
          description: 资源所有者的基本信息；系统资源返回创建者，分享不改变归属。
        creator:
          $ref: '#/components/schemas/UserSummary'
          description: 他人创建的用户模型返回创建者；自己的模型和系统模型不返回。
        shared_groups:
          type: array
          readOnly: true
          items: {$ref: '#/components/schemas/GroupSummary'}
          description: 仅资源所有者可见的直接分享分组，未分享时为空数组；不展开成员。
        shared_users:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
          description: 仅自己的用户模型返回分享用户列表，未分享时为空数组，排除已删除用户。接收方和系统模型不返回此字段。
        id:
          type: string
          format: uuid
          description: MonkeyAI 内部模型 UUID，模型代理兼容使用该值作为请求的 model。
        model:
          type: string
          description: 格式为 model_id@id，由数据库 models.model_id 与内部模型 UUID 拼接；Agent 调用模型代理时将此值作为请求的 model，代理精确定位配置并转换为上游模型名称。
        display_name:
          type: string
          description: Agent 向用户展示的模型名称。
        protocol:
          type: string
          enum: [openai_chat_completions, openai_responses, anthropic, image_generation, video_generation]
          description: MonkeyAI 与上游服务通信时使用的协议。
        kind:
          type: string
          enum: [text, image, video]
        image_config:
          $ref: '#/components/schemas/AgentImageConfig'
        image_pricing:
          $ref: '#/components/schemas/AgentImagePricing'
        context_window_tokens:
          type: integer
          format: int64
          minimum: 0
          description: 文本模型必须大于 0；生图模型为 0。
        max_output_tokens:
          type: integer
          format: int64
          minimum: 0
          description: 文本模型必须大于 0；生图模型为 0。
        supports_vision:
          type: boolean
          description: 模型是否支持图像输入。
        supports_reasoning:
          type: boolean
          description: 模型是否支持推理能力。
        credit_multiplier:
          type: number
          exclusiveMinimum: 0
          description: 本模型消耗积分时使用的倍率。
        tags:
          type: array
          items: {$ref: '#/components/schemas/ResourceTag'}
    APIKeysResponse:
      type: object
      required: [api_keys]
      properties:
        api_keys:
          type: array
          description: 当前用户的调用密钥元数据，不包含可用于鉴权的密钥原文。
          items:
            $ref: "#/components/schemas/APIKey"
    CreateAPIKeyInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          description: 便于用户识别密钥用途的名称。
        scopes:
          type: array
          description: 调用权限；不传或传空数组时默认为 model:invoke。
          default:
          - model:invoke
          uniqueItems: true
          items:
            type: string
            enum:
            - model:invoke
            - mcp:invoke
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
          description: 密钥自创建时起的有效天数。
      additionalProperties: false
      description: 创建全局调用密钥；MCP 使用 mcp:invoke scope，无需绑定连接或凭证，具体资源访问权由代理地址及用户权限决定。
    APIKey:
      type: object
      required:
      - id
      - user_id
      - name
      - key_prefix
      - scopes
      - expires_at
      - created_at
      properties:
        id:
          type: string
          format: uuid
          description: 调用密钥 ID。
        user_id:
          type: string
          format: uuid
          description: 密钥所属用户 ID。
        user_name:
          type: string
          description: 密钥所属用户的显示名称。
        name:
          type: string
          description: 用户设置的密钥名称。
        key_prefix:
          type: string
          description: 用于识别密钥的安全前缀，不可用于鉴权。
          examples:
          - mk_abcd1234
        scopes:
          type: array
          description: 密钥具备的调用权限。
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - model:invoke
            - mcp:invoke
        expires_at:
          type: string
          format: date-time
          description: 密钥过期时间。
        last_used_at:
          type: string
          format: date-time
          description: 最近一次成功使用时间；从未使用时不返回。
        created_at:
          type: string
          format: date-time
          description: 密钥创建时间。
        revoked_at:
          type: string
          format: date-time
          description: 密钥撤销时间；尚未撤销时不返回。
    CreatedAPIKey:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [api_key]
          properties:
            api_key:
              type: string
              pattern: "^mk_"
              description: 可用于模型或 MCP 请求鉴权的密钥原文，只返回一次。

    ResourceGrant:
      type: object
      properties:
        user_id:
          type:
          - string
          - 'null'
          format: uuid
        user:
          readOnly: true
