  /api/auth/v1/email/code:
    post:
      summary: 发送邮箱验证码
      description: login 受 email_code_enabled 控制；reset 受 password_enabled 控制。每邮箱每分钟最多 1 次、每小时最多 10 次，每连接来源 IP 每小时最多 30
        次；失败发送也计入限额。开启 email_code_auto_registration_enabled 时，新邮箱可获取 login 验证码；
        未开启自动注册的未知邮箱、停用或不符合用途的账号返回相同成功响应但不发送邮件。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - purpose
              properties:
                email: &a1
                  type: string
                  format: email
                  maxLength: 254
                  description: 邮箱会去除首尾空白并转为小写。
                purpose:
                  type: string
                  enum:
                    - login
                    - reset
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - retry_after
                properties:
                  message:
                    type: string
                  retry_after:
                    type: integer
                    const: 30
        "400":
          description: 请求无效，或验证码无效、过期、超过错误次数限制
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "401":
          description: 邮箱密码不匹配或账号不符合登录入口角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "403":
          description: 对应登录方式或注册开关关闭
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "409":
          description: 邮箱已存在，注册冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "429":
          description: 验证码发送过于频繁
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
          headers:
            Retry-After:
              schema:
                type: integer
                const: 60
        "500":
          description: 认证操作失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "502":
          description: 邮件发送失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
        "503":
          description: 认证配置或邮件服务不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
  /api/auth/v1/email/reset-password:
    post:
      summary: 通过邮箱验证码重置密码
      description: 使用 reset 用途验证码，需要开启密码登录。重置后撤销全部旧浏览器会话、OAuth token
        和未使用授权码，并使现有登录验证码失效。不会自动登录。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
                - password
              properties:
                email: *a1
                code: &a2
                  type: string
                  pattern: ^[0-9]{6}$
                  description: 十分钟内有效的六位数字验证码，仅可使用一次。
                password: &a3
                  type: string
                  minLength: 12
                  maxLength: 1024
                  writeOnly: true
                  description: 新密码至少 12 个字符，长度按 UTF-8 字节校验。
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - reset
                properties:
                  reset:
                    type: boolean
                    const: true
        "400":
          description: 请求无效，或验证码无效、过期、超过错误次数限制
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuthError"
