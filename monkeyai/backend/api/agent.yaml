    OAuthConnectionConfig:
      type: object
      description: dynamic 模式只需 MCP URL，首次授权自动发现 OAuth 元数据并动态注册客户端；发现及注册结果由后端维护，同一 URL 的普通编辑保留结果，修改 URL 后重新发现。manual 或未指定模式时，授权与 Token URL 必填，Client ID 和 Registration URL 至少填写一个。后续授权与刷新复用客户端；不支持需要初始访问令牌的注册端点。
      properties:
        mode:
          type: string
          enum: ['', manual, dynamic]
          description: 动态自动发现与传统手动配置分开；未指定时沿用已有手动端点配置。
        resource:
          type: string
          readOnly: true
          description: 自动发现的资源标识，授权及 Token 请求携带此 resource 参数。
        authorization_url:
          type: string
        token_url:
          type: string
        client_id:
          type: string
        registration_url:
          type: string
          description: RFC 7591 动态客户端注册端点；已有 Client ID 时复用，动态注册密钥到期后在下次授权前重新注册，旧客户端对应的凭证需重新授权。
        token_endpoint_auth_method:
          type: string
          enum: ['', none, client_secret_post, client_secret_basic]
          description: 自动发现模式按服务端元数据选择认证方式，优先 none；手动端点配置留空时，动态注册请求 none，已有客户端沿用 client_secret_post；注册后保存服务端返回的方式。
        client_secret_expires_at:
          type: integer
          format: int64
          readOnly: true
          description: 注册服务器返回的客户端密钥到期时间（Unix 秒）；未返回或为 0 表示无已知期限，由后端维护，修改请求中的值被忽略。
