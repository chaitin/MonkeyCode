          format: date-time
        description:
          type: string
        url:
          type: string
          format: uri
        authorization_mode:
          type: string
          enum:
          - none
          - centralized
          - independent
        authorization_method:
          type:
          - string
          - 'null'
        oauth_config:
          $ref: '#/components/schemas/OAuthConnectionConfig'
        callback_url:
          type: string
          readOnly: true
          description: OAuth MCP 的专属完整回调地址，格式为 {MONKEYAI_PUBLIC_URL}/oauth/connectors/{id}/callback；非 OAuth 连接为空字符串。
        config_revision:
          type: integer
        credential_configured:
          type: boolean
        connection_status:
          type: string
        tool_count:
          type: integer
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorCredential'
      required:
      - id
      - name
      - revision
      - grants
      - callback_url
    ConnectorInput:
      type: object
      properties:
        tag_ids:
          type: array
          items: {type: string, format: uuid}
        description:
          type: string
        url:
          type: string
          format: uri
        name:
          type: string
          minLength: 1
          maxLength: 200
        grants:
          type: array
          items:
            $ref: '#/components/schemas/ResourceGrant'
        authorization_mode:
          type: string
          enum:
          - none
          - centralized
          - independent
        authorization_method:
          type:
          - string
          - 'null'
          enum:
          - oauth
          - http_header
          - null
        oauth_config:
          $ref: '#/components/schemas/OAuthConnectionConfig'
        oauth_client_secret:
          type: string
          writeOnly: true
          description: 省略保留，空字符串清空；应用或端点变更时省略会清除旧 Secret。
      required:
      - name
    AgentCredential:
      allOf:
      - $ref: '#/components/schemas/ConnectorCredential'
      - type: object
        properties:
          tools:
            type: array
            items:
              $ref: '#/components/schemas/MCPTool'
          tools_version:
            type: string
          mcp_gateway:
            $ref: '#/components/schemas/MCPGateway'
    AuthorizationName:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - name
    ConnectorCredential:
      type: object
      properties:
        id:
          type: string
          format: uuid
        connector_id:
          type: string
          format: uuid
        user:
          oneOf:
          - $ref: '#/components/schemas/UserSummary'
          - type: 'null'
          readOnly: true
          description: 凭证所属的平台用户基本信息；集中凭证为 null，不读取上游 OAuth 用户资料。
        name:
          type: string
        revision:
          type: integer
        config_revision:
          type: integer
        authorization_status:
          type: string
          enum:
          - authorized
          - authorization_required
          - revoked
        connection_status:
          type: string
          enum:
          - unknown
          - connected
          - error
        header_names:
          type: array
          items:
            type: string
        last_checked_at:
          type:
          - string
          - 'null'
          format: date-time
        last_error:
          type:
          - string
          - 'null'
        oauth_expires_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type:
          - string
          - 'null'
          format: date-time
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - connector_id
      - user
      - name
      - revision
      - authorization_status
      - connection_status
    ConnectorDependency:
      type: object
      properties:
        required:
          type: boolean
        tool_allowlist:
          type: array
          items:
            type: string
        tool_denylist:
          type: array
          items:
            type: string
        connector_id:
          type: string
          format: uuid
      required:
      - connector_id
    CredentialPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        http_headers:
          type: object
          minProperties: 1
          maxProperties: 30
          additionalProperties:
            type: string
          writeOnly: true
          description: 完整 Header 键值；禁止大小写重复、CR/LF、Host、传输控制、Mcp-*、Content-Type 和 Accept。整组替换，响应不回填。
      minProperties: 1
    MCPGateway:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: 以 /mcp 为前缀：免认证为 /mcp/connectors/{id}，集中或独立认证为 /mcp/connectors/{id}/credentials/{credential_id}。全局 API Key
            认证用户，服务端校验地址对应连接使用权、凭证归属和有效性。
        transport:
          const: streamable_http
        authentication:
          const: api_key
        required_scope:
          const: mcp:invoke
      required:
      - url
      - transport
      - authentication
      - required_scope
