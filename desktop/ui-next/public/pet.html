<!DOCTYPE html>
<!-- 桌宠状态页:macOS/Linux 直接作为透明置顶小窗;
     Windows(含 Win7)上隐藏运行,只承担状态聚合与音效,画面推送给壳的原生 layered window。
     形象:官方吉祥物 52 帧精灵图(pet-sprite.webp,88px@2x),
     CSS steps 逐帧播放——待机慢速打盹、运行中正面敲键盘、等审批定格
     摇晃、离线定格在低头睡着帧并灰化。
     数据流:pet-core.mjs 聚合会话与提醒 → pet-runtime.mjs 展示/音效 → 原生窗口同步
     (壳聚合引擎状态,引擎重启对本页透明);快照失败视为引擎离线,
     3s 重试,另有 10s 周期性快照兜底探活。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MonkeyCode 桌宠</title>
<style>
  * { box-sizing:border-box; user-select:none; -webkit-user-select:none; }
  html, body { margin:0; background:transparent; overflow:hidden; }
  body {
    width:180px; height:164px; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-end;
    font:11px/1.4 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    cursor:grab;
  }
  body:active { cursor:grabbing; }
  body { transform-origin:top left; }

  /* ---- 气泡 ---- */
  #bubble {
    max-width:176px; flex-shrink:0; padding:4px 9px; border-radius:9px; margin-bottom:2px;
    background:rgba(19,19,22,.88); color:#d8d8de; text-align:center;
    white-space:pre; overflow:hidden; text-overflow:ellipsis; position:relative;
    opacity:0; transform:translateY(4px); transition:opacity .2s, transform .2s;
  }
  #bubble::after {  /* 小尾巴 */
    content:""; position:absolute; left:50%; bottom:-4px; margin-left:-4px;
    border:4px solid transparent; border-top-color:rgba(19,19,22,.88); border-bottom:0;
  }
  body.has-bubble #bubble { opacity:1; transform:none; }
  #bubble.ok  { background:rgba(5,150,105,.92); color:#eafff5; }
  #bubble.ok::after { border-top-color:rgba(5,150,105,.92); }
  #bubble.warn { background:rgba(161,98,7,.92); color:#fff7e0; }
  #bubble.warn::after { border-top-color:rgba(161,98,7,.92); }
  #bubble.err { background:rgba(185,52,52,.92); color:#ffecec; }
  #bubble.err::after { border-top-color:rgba(185,52,52,.92); }

  /* ---- 吉祥物精灵图:52 帧横条。
         帧段:1-7 无所事事 / 8-37 正面敲键盘 / 38-44 看通知 / 45-51 庆祝 / 52 睡着。
         各状态在自己的帧段内 steps 循环;庆祝只播一遍后定格末姿势 ---- */
  #wrap { width:88px; height:88px; flex-shrink:0; }
  /* 只变换原图的外层，按压始终以脚底为锚点，不打断精灵帧动画。 */
  #wrap { transform-origin:center bottom; }
  #wrap.pressed { transform:scale(1.10,.84); }
  @media (prefers-reduced-motion:reduce) {
    #wrap.pressed { transform:scale(1.025,.97); }
  }
  #sprite {
    width:88px; height:88px;
    background:url(pet-sprite.webp) 0 0 / 4576px 88px no-repeat;
  }
  @keyframes idle-loop   { from { background-position-x:0; }       to { background-position-x:-616px; } }
  @keyframes work-loop   { from { background-position-x:-616px; }  to { background-position-x:-3256px; } }
  @keyframes notify-loop { from { background-position-x:-3256px; } to { background-position-x:-3872px; } }
  @keyframes cheer-once  { from { background-position-x:-3872px; } to { background-position-x:-4488px; } }

  /* 空闲 7 帧全是独立姿势(非补间)。桌宠挂在余光位,动作越频繁越抢注意力,
     而空闲正是最不该抢注意力的状态:2.5s/姿势 ≈ 人发呆时的小动作节奏 */
  body.st-idle      #sprite { animation:idle-loop 17.5s steps(7) infinite; }
  body.st-running   #sprite { animation:work-loop 4.8s steps(30) infinite; }
  body.st-waiting   #sprite { animation:notify-loop 1.6s steps(7) infinite; }
  /* 庆祝:播一遍(帧 45-51),动画结束回落到基准位 = 末帧叉腰挺胸,撑满气泡时长 */
  body.st-celebrate #sprite { background-position-x:-4400px; animation:cheer-once 1.4s steps(7); }
  body.st-offline   #sprite {
    background-position-x:-4488px; /* 第 52 帧:完全低头睡着 */
    filter:grayscale(.7) brightness(.92); opacity:.85;
  }
</style>
</head>
<body class="st-offline">
  <div id="bubble"></div>
  <div id="wrap"><div id="sprite"></div></div>

<script type="module" src="pet-runtime.mjs"></script>
</body>
</html>
