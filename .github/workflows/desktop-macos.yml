name: Desktop macOS Build

# macOS runner 计费贵,不随 push 自动构建;需要出包时在 Actions 页手动 Run workflow
on:
  workflow_dispatch:

# 引擎版本 = agent/ submodule 的 gitlink(仓库内单一来源);
# 升级引擎 = bump submodule(配合壳的 system/ready 能力握手)

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # 浏览器扩展:随包分发(tauri bundle.resources 引用 dist,缺失会打包失败)
      - name: Build browser extension
        working-directory: browser-extension
        run: |
          npm ci
          npm run build

      # 引擎源码来自 agent/ submodule(私库,checkout 默认 GITHUB_TOKEN
      # 无跨库权限 → 用 OHMYAGENT_REPO_TOKEN;.gitmodules 是 ssh URL,
      # 经 insteadOf 重写为带 token 的 https)。单引擎化后引擎必须进包,
      # 凭据缺失直接失败而非静默出无引擎包
      - name: Checkout engine submodule (agent/)
        env:
          OHMYAGENT_REPO_TOKEN: ${{ secrets.OHMYAGENT_REPO_TOKEN }}
        run: |
          [ -n "$OHMYAGENT_REPO_TOKEN" ] || { echo "::error::OHMYAGENT_REPO_TOKEN 未配置,引擎无法进包"; exit 1; }
          git config --global url."https://x-access-token:${OHMYAGENT_REPO_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init agent plugins

      # unsigned 构建独占一个 step,只拿编译期配置,接触不到任何 Apple/updater
      # 私钥。release 模式由 secret 是否存在转换成布尔值,不把 secret 内容传入。
      - name: Build unsigned app bundle (universal)
        working-directory: desktop
        env:
          MACOS_RELEASE_BUILD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          # 装机/使用统计的上报地址,编译期内联(desktop/src/telemetry.rs)。
          MC_MATOMO_URL: ${{ secrets.MC_MATOMO_URL }}
          MC_MATOMO_SITE_ID: ${{ secrets.MC_MATOMO_SITE_ID }}
          OHMYAGENT_SRC: ${{ github.workspace }}/agent
        run: |
          set -euo pipefail
          if [ "$MACOS_RELEASE_BUILD" = "true" ]; then
            make macos-release-build
            echo "MACOS_RELEASE_SIGN=true" >> "$GITHUB_ENV"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY 未配置,仅构建 unsigned 测试包"
            make macos
            echo "MACOS_RELEASE_SIGN=false" >> "$GITHUB_ENV"
          fi

      # 在 unsigned 构建及候选指纹记录完成后才把签名材料放进 runner。
      - name: Prepare Apple signing and notarization
        if: env.MACOS_RELEASE_SIGN == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?Missing APPLE_CERTIFICATE}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing APPLE_CERTIFICATE_PASSWORD}"
          : "${ASC_KEY_ID:?Missing APP_STORE_CONNECT_KEY_ID}"
          : "${ASC_ISSUER_ID:?Missing APP_STORE_CONNECT_ISSUER_ID}"
          : "${ASC_PRIVATE_KEY_BASE64:?Missing APP_STORE_CONNECT_PRIVATE_KEY_BASE64}"
          KEY_DIR="$RUNNER_TEMP/appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_FILE="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_PRIVATE_KEY_BASE64" | base64 -D > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "APPLE_API_KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Sign and notarize existing build
        if: env.MACOS_RELEASE_SIGN == 'true'
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: BEIJING CHAITIN TECHNOLOGY Co.,Ltd. (8Z56KX83T3)"
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: make macos-release

      - name: Zip .app
        working-directory: desktop/target/universal-apple-darwin/release/bundle
        run: ditto -c -k --keepParent macos/MonkeyCode.app MonkeyCode-macos-universal.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MonkeyCode-macos-universal
          path: |
            desktop/target/universal-apple-darwin/release/bundle/MonkeyCode-macos-universal.app.zip
            desktop/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            desktop/target/universal-apple-darwin/release/bundle/updater/*
